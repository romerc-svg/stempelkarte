<style>
/* TICKO – ein Gerät ("TK-1"): oben die Platte mit LED-Matrix, darunter der Bildschirm-Inhalt, unten drei Tasten.
   Auf dem Handy randlos, am Desktop als Gerät im Rahmen. */
:root{
  --stage:#121210;
  --body:#D8D5CF; --panel:#ECEAE5; --edge:#B9B5AD; --well:#C9C5BD; --ink:#24231F; --muted:#77736B; --faint:#9E998F;
  --lcd:#140F0B; --led:#FF5B23; --led-half:#8E3416; --led-off:#2B1A12; --ok:#2F7A4B;
  --lcd-shadow:rgba(0,0,0,.7); --lrow:#C9542A; --glow-txt:rgba(255,91,35,.45); --glow-a:.4; --px-square:0;
  --accent:#FF5B23; --accent-fg:#fff; --danger:#FF5B23; --danger-edge:#B53A10;
  --hi:#fff; --hi-strong:#fff; --knob1:#F8F6F2; --knob2:#DCD8D1; --dot:#B7B2A9;
  --main-bg:#24231F; --main-fg:#ECEAE5; --main-label:#A7A298;
  --glitter:0; --bow:0;
  color-scheme:light;
  --mono:"Chivo Mono", ui-monospace, Menlo, monospace;
  --dots:"Doto", ui-monospace, Menlo, monospace;
  --sys:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --spring:cubic-bezier(.3,1.5,.5,1);
}
/* Dunkelmodus: dunkles Gehäuse, Display im klassischen Game-Boy-Grün */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --stage:#0A0A09;
    --body:#1D1E1B; --panel:#2A2B27; --edge:#111210; --well:#151613; --ink:#ECE9E0; --muted:#9A968C; --faint:#6E6B63;
    --lcd:#A4C21A; --led:#0B2B0B; --led-half:#3E7A2E; --led-off:#9BB916; --ok:#9BBC0F; --px-square:1;
    --lcd-shadow:rgba(0,0,0,.45); --lrow:#1F4A1A; --glow-txt:transparent; --glow-a:0;
    --accent:#9BBC0F; --accent-fg:#0F380F; --danger:#E5533D; --danger-edge:#8E2A1B;
    --hi:rgba(255,255,255,.07); --hi-strong:#5A5C54; --knob1:#45473F; --knob2:#33352F; --dot:#4A4C45;
    --main-bg:#0F380F; --main-fg:#9BBC0F; --main-label:#8BAC0F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --stage:#0A0A09;
    --body:#1D1E1B; --panel:#2A2B27; --edge:#111210; --well:#151613; --ink:#ECE9E0; --muted:#9A968C; --faint:#6E6B63;
    --lcd:#A4C21A; --led:#0B2B0B; --led-half:#3E7A2E; --led-off:#9BB916; --ok:#9BBC0F; --px-square:1;
    --lcd-shadow:rgba(0,0,0,.45); --lrow:#1F4A1A; --glow-txt:transparent; --glow-a:0;
    --accent:#9BBC0F; --accent-fg:#0F380F; --danger:#E5533D; --danger-edge:#8E2A1B;
    --hi:rgba(255,255,255,.07); --hi-strong:#5A5C54; --knob1:#45473F; --knob2:#33352F; --dot:#4A4C45;
    --main-bg:#0F380F; --main-fg:#9BBC0F; --main-label:#8BAC0F;
  color-scheme:dark;
}
/* Pink („Barbie“): hell mit pink leuchtender LED, dunkel mit zuckerrosa Display; dezenter Glitzer */
:root[data-palette="pink"]{
  --stage:#2A0F1E;
  --body:#F7C6DC; --panel:#FFE4F0; --edge:#E79BBE; --well:#F2B5D0; --ink:#4A0F2E; --muted:#A04A75; --faint:#C77DA0;
  --lcd:#2B0618; --led:#FF4FB3; --led-half:#9C2468; --led-off:#3E0C25; --ok:#C2187A; --px-square:0;
  --lcd-shadow:rgba(60,0,30,.7); --lrow:#FF8AC9; --glow-txt:rgba(255,79,179,.55); --glow-a:.5;
  --accent:#E0218A; --accent-fg:#fff; --danger:#D7263D; --danger-edge:#8E1426;
  --hi:#fff; --hi-strong:#fff; --knob1:#FFF5FA; --knob2:#F6CFE1; --dot:#E8A9C6;
  --main-bg:#E0218A; --main-fg:#fff; --main-label:#FFD0E8;
  --glitter:1; --bow:1; color-scheme:light;
  --sp1:rgba(255,255,255,.95); --sp2:rgba(255,255,255,.7); --sp3:rgba(255,190,225,.9);
}
@media (prefers-color-scheme:dark){
  :root[data-palette="pink"]:not([data-theme="light"]){
    --stage:#0E0509;
    --body:#2A1120; --panel:#3A1A2D; --edge:#160810; --well:#200C18; --ink:#FFE1EF; --muted:#D08BAE; --faint:#8E5574;
    --lcd:#FFB8DA; --led:#5C0A35; --led-half:#C2307E; --led-off:#F7A8CF; --ok:#FF7AC2; --px-square:1;
    --lcd-shadow:rgba(0,0,0,.45); --lrow:#7A1446; --glow-txt:transparent; --glow-a:0;
    --accent:#FF5CB8; --accent-fg:#3A0A22; --danger:#FF4D6D; --danger-edge:#8E1A30;
    --hi:rgba(255,255,255,.08); --hi-strong:#7A4A63; --knob1:#5A2E45; --knob2:#43213A; --dot:#5C3249;
    --main-bg:#5C0A35; --main-fg:#FFB8DA; --main-label:#F7A8CF;
    --glitter:.6; --bow:1; color-scheme:dark;
    --sp1:rgba(255,190,225,.22); --sp2:rgba(255,255,255,.12); --sp3:rgba(255,120,190,.2);
  }
}
:root[data-palette="pink"][data-theme="dark"]{
    --stage:#0E0509;
    --body:#2A1120; --panel:#3A1A2D; --edge:#160810; --well:#200C18; --ink:#FFE1EF; --muted:#D08BAE; --faint:#8E5574;
    --lcd:#FFB8DA; --led:#5C0A35; --led-half:#C2307E; --led-off:#F7A8CF; --ok:#FF7AC2; --px-square:1;
    --lcd-shadow:rgba(0,0,0,.45); --lrow:#7A1446; --glow-txt:transparent; --glow-a:0;
    --accent:#FF5CB8; --accent-fg:#3A0A22; --danger:#FF4D6D; --danger-edge:#8E1A30;
    --hi:rgba(255,255,255,.08); --hi-strong:#7A4A63; --knob1:#5A2E45; --knob2:#43213A; --dot:#5C3249;
    --main-bg:#5C0A35; --main-fg:#FFB8DA; --main-label:#F7A8CF;
    --glitter:.6; --bow:1; color-scheme:dark;
    --sp1:rgba(255,190,225,.22); --sp2:rgba(255,255,255,.12); --sp3:rgba(255,120,190,.2);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
html{position:fixed;inset:0;width:100%}
body{background:var(--body);color:var(--ink);font-family:var(--mono);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;touch-action:manipulation}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.device{height:100%;display:flex;flex-direction:column;background:var(--body);position:relative;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px)}
.device :not(input){-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (min-width:600px){
  body{background:var(--stage);display:grid;place-items:center;padding:20px}
  .device{width:400px;height:min(860px,calc(100vh - 40px));border-radius:48px;padding-top:28px;
    box-shadow:0 0 0 11px #1A1A18,0 0 0 12px #36352F,0 40px 80px -30px rgba(0,0,0,.8)}
}

/* ---------- Bildschirme ---------- */
.screen{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding-bottom:12px}
.screen::-webkit-scrollbar{display:none}
.screen[hidden]{display:none}

/* ---------- Platte & Display ---------- */
.plate{margin:8px 14px 0;background:var(--panel);border-radius:28px;padding:14px 14px 12px;position:relative;flex:none;
  box-shadow:inset 0 1px 0 var(--hi),inset 0 -2px 0 var(--edge),0 1px 2px rgba(0,0,0,.08)}
.screw{position:absolute;width:9px;height:9px;border-radius:50%;top:11px;background:radial-gradient(circle at 35% 35%,var(--hi-strong),var(--edge));box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.screw::after{content:"";position:absolute;left:1px;right:1px;top:4px;height:1px;background:rgba(0,0,0,.35);transform:rotate(35deg)}
.screw.l{left:11px}.screw.r{right:11px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:0 12px 10px 16px;min-height:26px}
.brand b{font-weight:600}
.fmt{display:flex;background:var(--well);border-radius:9px;padding:2px;box-shadow:inset 0 1px 3px rgba(0,0,0,.18)}
.fmt button{font-size:10px;letter-spacing:.1em;padding:4px 8px;border-radius:7px;color:var(--muted)}
.fmt button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 0 var(--edge)}
.lcd{background:var(--lcd);border-radius:16px;padding:10px 10px 9px;box-shadow:inset 0 3px 12px var(--lcd-shadow),0 1px 0 var(--hi);position:relative;overflow:hidden;color:var(--led)}
.lcd::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.07),transparent 40%);pointer-events:none}
/* Die Stempeluhr-Platte wächst mit dem freien Platz, das Display füllt sie */
#scr-clock .plate{flex:1 1 auto;min-height:190px;display:flex;flex-direction:column}
#scr-clock .lcd{flex:1;min-height:0;display:flex;flex-direction:column}
.scene{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
#scr-clock .switchwrap{margin-top:14px}
/* Verlauf: nur die Liste scrollt, im eigenen Fenster */
.list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;padding-bottom:6px;
  -webkit-mask-image:linear-gradient(transparent,#000 12px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(transparent,#000 12px,#000 calc(100% - 18px),transparent)}
.list::-webkit-scrollbar{display:none}
/* Kleine Bildschirme (z. B. iPhone SE): alles etwas kompakter */
@media (max-height:720px){
  .plate{padding:10px 12px 10px}
  .brand{padding-bottom:7px}
  .read{margin-top:9px}.read > *{padding:7px 9px 6px}.read b{font-size:22px}
  .weekhead{margin:10px 18px 6px}
  .imp{width:min(100%,62px);font-size:15px}.imp small{display:none}
  .track{height:56px}.thumb{height:46px}
  .switchwrap{padding:9px}.switchlbl{padding-bottom:6px}
  .key{height:44px}
  .ldig{font-size:60px}
  .fields{gap:9px;padding:12px}.field input{min-height:46px}
}
.ticker{height:18px;margin-top:6px;overflow:hidden;font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;text-overflow:ellipsis;text-shadow:0 0 8px var(--glow-txt)}
.ticker .car{display:inline-block;width:7px;height:11px;background:var(--led);vertical-align:-1px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lrow{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--lrow)}
.ldig{font:900 76px/1 var(--dots);text-align:center;margin:8px 0 4px;text-shadow:0 0 18px var(--glow-txt);font-variant-numeric:tabular-nums;position:relative}
.ldig.dim{color:var(--led-off);text-shadow:none}

/* ---------- Läuft-Zustand (eingestempelt) ---------- */
.rec-chip{display:none;align-items:center;gap:6px;padding:4px 9px 4px 7px;border-radius:99px;background:var(--accent);color:var(--accent-fg);font-size:9.5px;letter-spacing:.14em;font-weight:600;flex:none}
.rec-chip i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:recblink 1.2s steps(1) infinite}
@keyframes recblink{50%{opacity:.2}}
.on .rec-chip{display:inline-flex}
.on .brand > b{display:none}
.live{position:absolute;left:50%;top:6%;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;padding:7px 16px 8px;border-radius:14px;
  background:color-mix(in srgb,var(--lcd) 82%,transparent);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--led) 45%,transparent);pointer-events:none;z-index:2;white-space:nowrap}
.on .live{display:flex}
.live b{font:900 clamp(30px,10vw,40px)/1 var(--dots);color:var(--led);text-shadow:0 0 14px var(--glow-txt);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.live small{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--lrow);margin-top:4px}
@media (max-height:720px){.live{top:3%;padding:3px 12px 4px}.live b{font-size:24px}.live small{display:none}}
@keyframes onring{
  0%,100%{box-shadow:inset 0 1px 0 var(--hi),inset 0 -2px 0 var(--edge),0 0 0 2px color-mix(in srgb,var(--accent) 75%,transparent),0 0 0 0 color-mix(in srgb,var(--accent) 35%,transparent)}
  50%{box-shadow:inset 0 1px 0 var(--hi),inset 0 -2px 0 var(--edge),0 0 0 2px color-mix(in srgb,var(--accent) 75%,transparent),0 0 0 7px color-mix(in srgb,var(--accent) 0%,transparent)}}
.on #scr-clock .plate{animation:onring 2.2s ease-in-out infinite}
.on .read .main{background:var(--accent);border-color:var(--accent);color:color-mix(in srgb,var(--accent-fg) 78%,transparent);position:relative}
.on .read .main b{color:var(--accent-fg)}
.on .read .main::after{content:"";position:absolute;right:10px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--accent-fg);animation:ledpulse 1.4s ease-in-out infinite}
.on .track{background:color-mix(in srgb,var(--accent) 22%,var(--well))}
.on .track .lane span:last-child{color:var(--accent)}

/* ---------- Doppelpunkt der Ziffernanzeigen ----------
   Doto-Ziffern reichen von der Grundlinie bis 0,695 em; der Doppelpunkt der Schrift sitzt tiefer.
   Eigener Doppelpunkt: feste Breite, zwei Punkte symmetrisch um die Ziffernmitte (0,35 em). */
.colon{display:inline-block;position:relative;width:.3em;height:.695em;vertical-align:baseline}
.colon .vh{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0}
.colon::before{content:"";position:absolute;left:50%;bottom:.15em;width:.1em;height:.1em;margin-left:-.05em;border-radius:50%;background:currentColor;
  box-shadow:0 -.3em 0 currentColor,0 0 .25em var(--colon-glow,transparent),0 -.3em .25em var(--colon-glow,transparent)}
.ldig,.live b,.sp-greet{--colon-glow:var(--glow-txt)}

/* ---------- Ablesewerte ---------- */
.read{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;margin:12px 14px 0;flex:none}
.read > *{border:1.5px solid var(--edge);border-radius:16px;padding:9px 10px 8px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:0;text-align:left}
.read b{display:block;font:900 26px/1.05 var(--dots);color:var(--ink);letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.read b.word{font:600 13px/2.05 var(--mono);letter-spacing:.06em}
.read small{display:block;font-size:9px;letter-spacing:.08em;margin-top:2px;white-space:nowrap}
.read .main{background:var(--main-bg);border-color:var(--main-bg);color:var(--main-label)}
.read .main b{color:var(--main-fg)}
.read button.edit{position:relative}
.read button.edit::after{content:"";position:absolute;right:9px;top:9px;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg)}

/* ---------- Woche als Stempelabdrücke ---------- */
.weekhead{display:flex;justify-content:space-between;margin:16px 18px 8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);flex:none}
.week{margin:0 14px;display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px;text-align:center;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);flex:none}
.imp{width:min(100%,76px);aspect-ratio:1;margin:0 auto 6px;border-radius:50%;display:grid;place-content:center;border:2px dashed var(--edge);font:900 18px/1 var(--dots);letter-spacing:0;color:var(--muted)}
.imp small{display:block;font:600 8px var(--mono);letter-spacing:.12em;margin-top:3px}
.imp.done{border:2.5px solid var(--ink);color:var(--ink);transform:rotate(-8deg);box-shadow:inset 0 0 0 2.5px var(--body),inset 0 0 0 4px var(--ink)}
.imp.today{border:2.5px solid var(--accent);color:var(--accent);transform:rotate(6deg);box-shadow:inset 0 0 0 2.5px var(--body),inset 0 0 0 4px var(--accent)}
.day.cur{color:var(--ink);font-weight:600}

/* ---------- Schiebeschalter ---------- */
.switchwrap{margin:0 14px;background:var(--panel);border-radius:28px;padding:12px;flex:none;box-shadow:inset 0 1px 0 var(--hi),inset 0 -2px 0 var(--edge)}
.switchlbl{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:0 6px 8px;color:var(--muted)}
.switchlbl .act{color:var(--ink);font-weight:600}
.track{position:relative;height:66px;border-radius:19px;background:var(--well);box-shadow:inset 0 3px 8px rgba(0,0,0,.22);touch-action:none;cursor:grab}
.track .lane{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:10px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.thumb{position:absolute;top:5px;left:5px;width:calc(50% - 5px);height:56px;border-radius:15px;background:linear-gradient(var(--knob1),var(--knob2));box-shadow:0 2px 0 var(--edge),0 7px 14px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;gap:5px;transition:transform .5s var(--spring)}
.thumb i{width:2px;height:22px;background:var(--edge);border-radius:1px}
.thumb .led{position:absolute;right:12px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--dot)}
.on .thumb .led{background:var(--accent);box-shadow:0 0 8px var(--accent)}

/* ---------- Tasten ---------- */
.keys{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--body)}
@media (min-width:600px){.keys{padding-bottom:22px}}
.key{height:50px;border-radius:15px;background:var(--panel);box-shadow:inset 0 1px 0 var(--hi),0 3px 0 var(--edge);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .08s,box-shadow .08s}
.key:active{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--hi),0 1px 0 var(--edge)}
.key .dot{width:6px;height:6px;border-radius:50%;background:var(--dot)}
.key[aria-current="page"] .dot{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.key[aria-current="page"]{font-weight:600}

/* ---------- Rechner ---------- */
.kinds{display:grid;grid-template-columns:repeat(4,1fr);background:var(--well);border-radius:13px;padding:3px;box-shadow:inset 0 1px 3px rgba(0,0,0,.18)}
.kinds button{padding:9px 2px;border-radius:10px;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kinds button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 0 var(--edge)}
.fields{margin:12px 14px 0;background:var(--panel);border-radius:24px;padding:14px;display:grid;gap:12px;flex:none;box-shadow:inset 0 1px 0 var(--hi),inset 0 -2px 0 var(--edge)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-left:4px}
.field input{width:100%;min-height:52px;padding:10px 12px;border:0;border-radius:14px;background:var(--well);box-shadow:inset 0 2px 6px rgba(0,0,0,.18);font:600 17px var(--mono);color:var(--ink);-webkit-appearance:none;appearance:none}
.field input::-webkit-date-and-time-value{text-align:left}
.bigkey{margin:12px 14px 0;height:58px;border-radius:18px;background:var(--ink);color:var(--panel);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;box-shadow:0 4px 0 #000;transition:transform .08s,box-shadow .08s;flex:none}
.bigkey:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.bigkey:disabled{background:var(--well);color:var(--faint);box-shadow:0 4px 0 var(--edge)}
.msg{margin:10px 18px 0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;min-height:1.4em;color:var(--muted)}
.msg.ok{color:var(--ok)}

/* ---------- Verlauf ---------- */
.wk{margin:12px 14px 0;background:var(--panel);border-radius:22px;padding:12px 14px 4px;flex:none;box-shadow:inset 0 1px 0 var(--hi),inset 0 -2px 0 var(--edge)}
.wk h3{margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding-bottom:4px}
.wk h3 b{font:900 22px/1 var(--dots);letter-spacing:0}
.istsoll{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:9px 0 10px;border-bottom:1.5px solid var(--edge);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.istsoll b{display:block;font:900 17px/1.15 var(--dots);letter-spacing:0;color:var(--ink);margin-top:2px}
.istsoll .pos b{color:var(--ok)} .istsoll .neg b{color:var(--danger)}
.badge{font-size:8.5px;letter-spacing:.12em;padding:3px 6px;border-radius:6px;border:1.5px solid currentColor;margin-left:6px;vertical-align:2px}
.badge.ok{color:var(--ok)} .badge.low{color:var(--muted)} .badge.over{color:var(--accent)}
.entry{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--edge)}
.entry:last-child{border-bottom:0}
.entry .info{text-align:left;min-width:0;padding:2px 0}
.entry .info:active{opacity:.55}
.entry .d{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.entry .d::after{content:"";display:inline-block;width:5px;height:5px;margin-left:8px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:rotate(-45deg);vertical-align:2px}
.sheet .fieldset{display:grid;gap:10px}
.sheet .preview{margin:12px 4px 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);min-height:1.4em}
.sheet .preview.err{color:var(--danger)}
/* Feierabend-Planer */
.plan .lcd{padding:12px 14px 10px;margin-bottom:14px}
.plan .ldig{font-size:58px;margin:4px 0 2px}
.plan .range{position:relative;height:56px;border-radius:18px;background:var(--well);box-shadow:inset 0 3px 8px rgba(0,0,0,.22);padding:0 4px;display:flex;align-items:center}
.plan input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:48px;background:transparent;margin:0;touch-action:pan-x}
.plan input[type=range]::-webkit-slider-runnable-track{height:48px;background:transparent}
.plan input[type=range]::-moz-range-track{height:48px;background:transparent}
.plan input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:64px;height:46px;margin-top:1px;border-radius:14px;border:0;background:linear-gradient(var(--knob1),var(--knob2));box-shadow:0 2px 0 var(--edge),0 6px 12px rgba(0,0,0,.2)}
.plan input[type=range]::-moz-range-thumb{width:64px;height:46px;border-radius:14px;border:0;background:linear-gradient(var(--knob1),var(--knob2));box-shadow:0 2px 0 var(--edge),0 6px 12px rgba(0,0,0,.2)}
.plan .scale{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.1em;color:var(--muted);margin:6px 6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips button{padding:8px 11px;border-radius:11px;background:var(--body);box-shadow:inset 0 1px 0 var(--hi),0 2px 0 var(--edge);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.chips button:active{transform:translateY(1px);box-shadow:0 1px 0 var(--edge)}
.facts{display:grid;grid-template-columns:1fr auto;gap:7px 12px;margin:14px 4px 0;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.facts dt{color:var(--muted)} .facts dd{margin:0;text-align:right;font-weight:600}
.verdict{margin:12px 4px 0;padding:10px 12px;border-radius:12px;font-size:11px;line-height:1.5;letter-spacing:.06em;text-transform:uppercase;background:var(--body);border-left:4px solid var(--ink)}
.verdict.ok{border-color:var(--ok)} .verdict.warn{border-color:var(--danger)}
.entry .t{font-size:10.5px;color:var(--muted);margin-top:2px}
.entry .n{font:900 20px/1 var(--dots);text-align:right}
.entry .del{width:36px;height:36px;border-radius:11px;background:var(--body);box-shadow:inset 0 1px 0 var(--hi),0 2px 0 var(--edge);font-size:16px;color:var(--muted);line-height:1}
.entry .del:active{transform:translateY(1px);box-shadow:0 1px 0 var(--edge)}
.empty{margin:12px 14px 0;padding:22px 18px;border:2px dashed var(--edge);border-radius:22px;color:var(--muted);text-align:center;font-size:11px;letter-spacing:.06em;line-height:1.6;text-transform:uppercase}
.sync{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:center;margin:18px 14px 4px}

/* ---------- Glitzer (nur Pink) ---------- */
:root[data-palette="pink"] :is(.device,.plate,.switchwrap,.key,.fields,.wk,.sheet,.read > :not(.main)){
  background-image:
    radial-gradient(circle,var(--sp1) 0 .6px,transparent 1.3px),
    radial-gradient(circle,var(--sp2) 0 .5px,transparent 1.2px),
    radial-gradient(circle,var(--sp3) 0 .6px,transparent 1.3px);
  background-size:23px 29px,37px 31px,17px 21px;
  background-position:3px 5px,11px 17px,7px 2px}
.twinkles{display:none}
:root[data-palette="pink"] .twinkles{display:block;position:absolute;inset:0;pointer-events:none;z-index:30}
.twinkles i{position:absolute;width:11px;height:11px;background:#fff;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);opacity:0;animation:twinkle 4.2s ease-in-out infinite;filter:drop-shadow(0 0 3px rgba(255,120,200,.9))}
@keyframes twinkle{0%,70%,100%{opacity:0;transform:scale(.3) rotate(0)}80%{opacity:calc(var(--glitter) * .95);transform:scale(1) rotate(45deg)}90%{opacity:0;transform:scale(.4) rotate(90deg)}}

/* ---------- Einstellungen ---------- */
.gear{width:30px;height:30px;border-radius:10px;background:var(--well);box-shadow:inset 0 1px 3px rgba(0,0,0,.18);display:grid;place-items:center;color:var(--muted);flex:none}
.gear:active{transform:scale(.92)}
.gear svg{width:17px;height:17px}
.brand .tools{display:flex;gap:6px;align-items:center}
.setting{margin:0 4px 16px}
.setting h3{margin:0 0 8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.setting .kinds{grid-template-columns:repeat(3,1fr)}
.setting .kinds.two{grid-template-columns:1fr 1fr}
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatch{border-radius:16px;padding:10px;background:var(--body);box-shadow:inset 0 1px 0 var(--hi),0 3px 0 var(--edge);display:grid;gap:8px;text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border:2px solid transparent}
.swatch[aria-pressed="true"]{border-color:var(--accent)}
.swatch .chip{height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;position:relative;overflow:hidden}
.swatch .chip i{width:14px;height:14px;border-radius:50%}
.swatch.classic .chip{background:#D8D5CF}
.swatch.classic .chip i:nth-child(1){background:#140F0B;box-shadow:inset 0 0 0 3px #FF5B23}
.swatch.classic .chip i:nth-child(2){background:#A4C21A;box-shadow:inset 0 0 0 3px #0B2B0B}
.swatch.pink .chip{background:linear-gradient(135deg,#F7C6DC,#FF9ACB);
  background-image:radial-gradient(circle,#fff 0 .7px,transparent 1.4px),linear-gradient(135deg,#F7C6DC,#FF9ACB);background-size:9px 11px,100% 100%}
.swatch.pink .chip i:nth-child(1){background:#2B0618;box-shadow:inset 0 0 0 3px #FF4FB3}
.swatch.pink .chip i:nth-child(2){background:#FFB8DA;box-shadow:inset 0 0 0 3px #5C0A35}

/* ---------- Export ---------- */
.monthnav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;background:var(--well);border-radius:14px;padding:4px;box-shadow:inset 0 1px 3px rgba(0,0,0,.18)}
.monthnav button{height:40px;border-radius:11px;background:var(--panel);box-shadow:0 1px 0 var(--edge);font-size:16px}
.monthnav button:disabled{opacity:.35}
.monthnav b{text-align:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.exsum{display:flex;justify-content:space-between;margin:10px 4px 0;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.exsum b{color:var(--ink)}

/* ---------- Ladescreen (sieht aus wie das iOS-Startbild) ---------- */
.boot{position:fixed;inset:0;z-index:100;background:var(--body);color:var(--accent);transition:opacity .5s ease;
  animation:bootfail 0s 6s forwards}         /* falls das Skript hängt: nach 6 s weg */
.boot svg{position:absolute;left:50%;top:45%;width:96px;height:102.4px;transform:translate(-50%,-50%);shape-rendering:crispEdges}
.boot .dots{position:absolute;left:50%;top:calc(45% + 76px);transform:translateX(-50%);display:flex;gap:7px;opacity:0;animation:fadein .4s .25s forwards}
.boot .dots i{width:7px;height:7px;background:currentColor;animation:bootdot 1s steps(1) infinite}
.boot .dots i:nth-child(2){animation-delay:.33s}.boot .dots i:nth-child(3){animation-delay:.66s}
@keyframes bootdot{0%,100%{opacity:.25}33%{opacity:1}}
@keyframes fadein{to{opacity:1}}
@keyframes bootfail{to{opacity:0;visibility:hidden}}
.boot.out{opacity:0;pointer-events:none}

/* ---------- Startbildschirm ---------- */
.splash{position:absolute;inset:0;z-index:60;background:var(--body);display:flex;flex-direction:column;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 16px);
  transition:transform .7s cubic-bezier(.7,0,.2,1),opacity .5s .2s}
@media (min-width:600px){.splash{padding-top:30px;padding-bottom:24px}}
:root[data-palette="pink"] .splash{background-image:radial-gradient(circle,var(--sp1) 0 .6px,transparent 1.3px),radial-gradient(circle,var(--sp3) 0 .6px,transparent 1.3px);background-size:23px 29px,17px 21px}
.splash{opacity:0;transform:scale(.97)}
.splash.ready{opacity:1;transform:none;transition:opacity .6s ease,transform .8s var(--spring)}
.splash.leave{transform:translateY(-104%);opacity:0;transition:transform .7s cubic-bezier(.7,0,.2,1),opacity .5s .2s}
.splash .plate{flex:1;min-height:0;margin:0;display:flex;flex-direction:column}
.splash .lcd{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 12px 18px}
.sp-scene{flex:1;min-height:120px;position:relative}
.sp-scene canvas{position:absolute;inset:0;width:100%;height:100%}
.sp-greet{margin:6px 0 0;text-align:center;font:900 clamp(30px,10.5vw,46px)/1.02 var(--dots);text-transform:uppercase;letter-spacing:.01em;text-shadow:0 0 18px var(--glow-txt);text-wrap:balance}
.sp-sub{margin:10px 0 0;text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--lrow)}
.sp-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.sp-info div{border:1.5px solid var(--edge);border-radius:16px;padding:9px 12px 8px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sp-info b{display:block;font:900 24px/1.1 var(--dots);color:var(--ink);letter-spacing:0;margin-top:2px}
/* Der große Knopf: Gehäuse-Mulde, darin eine dicke Taste mit LED, Lichtreflex und Pfeil */
.sp-well{flex:none;background:var(--well);border-radius:28px;padding:8px;box-shadow:inset 0 3px 10px rgba(0,0,0,.25),0 1px 0 var(--hi)}
.sp-go{position:relative;width:100%;height:76px;border-radius:21px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 82%,#fff),var(--accent) 55%);
  color:var(--accent-fg);display:flex;align-items:center;justify-content:center;gap:14px;overflow:hidden;
  font:600 13px var(--mono);letter-spacing:.2em;text-transform:uppercase;
  box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 55%,#000),0 12px 22px -6px color-mix(in srgb,var(--accent) 60%,transparent),inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .12s,box-shadow .12s}
.sp-go::before{content:"";position:absolute;top:0;bottom:0;width:38%;left:-45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-18deg);animation:sweep 3.2s ease-in-out infinite 1s}
@keyframes sweep{0%,55%{left:-45%}85%,100%{left:120%}}
.sp-go .led{width:10px;height:10px;border-radius:50%;background:var(--accent-fg);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-fg) 25%,transparent);animation:ledpulse 1.4s ease-in-out infinite}
@keyframes ledpulse{50%{box-shadow:0 0 0 7px transparent;opacity:.55}}
.sp-go .arrow{display:inline-flex;width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--accent-fg) 16%,transparent);align-items:center;justify-content:center;font-size:17px;letter-spacing:0;transition:transform .3s var(--spring)}
.sp-go:active,.sp-go.pressed{transform:translateY(5px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000),0 4px 10px -6px color-mix(in srgb,var(--accent) 60%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
.sp-go.pressed .arrow{transform:translateX(6px)}

/* ---------- Sheet & Hinweis ---------- */
.scrim{position:absolute;inset:0;background:rgba(20,18,14,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;max-height:calc(100% - 16px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--panel);border-radius:30px;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);z-index:41;transform:translateY(calc(100% + 20px));transition:transform .5s var(--spring);box-shadow:inset 0 1px 0 var(--hi),0 -10px 40px rgba(0,0,0,.2)}
.sheet.show{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--edge);margin:0 auto 14px}
.sheet h2{margin:0 4px 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;flex:none}
#sheet-b{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -4px;padding:0 4px}
#sheet-b::-webkit-scrollbar{display:none}
.sheet .grab,.sheet .acts{flex:none}
.contract{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.contract .field label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contract output{display:flex;align-items:center;min-height:52px;padding:10px 12px;border-radius:14px;border:1.5px dashed var(--edge);font:600 17px var(--mono);color:var(--muted)}
@media (max-height:720px){.contract output{min-height:46px}}
.sheet p{margin:0 4px 14px;font-size:12px;line-height:1.55;color:var(--muted)}
.sheet .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sheet .acts button{height:54px;border-radius:16px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;background:var(--body);box-shadow:inset 0 1px 0 var(--hi),0 3px 0 var(--edge)}
.sheet .acts button.primary{background:var(--ink);color:var(--panel);box-shadow:0 3px 0 #000}
.sheet .acts button.danger{background:var(--danger);color:#fff;box-shadow:0 3px 0 var(--danger-edge)}

<script>
(function(){
  // ---------- Regeln ----------
  // Arbeitsvertrag: in den Einstellungen änderbar, hier die Standardwerte
  const LS_CONTRACT = "stempelkarte:vertrag";
  const CONTRACT_DEFAULT = {
    wochenStd: 19,        // Soll pro Woche
    maxStd: 19.5,         // höchstens pro Woche
    tage: 3,              // Arbeitstage pro Woche (welche Tage, ist egal)
    gutschriftStd: null,  // Urlaub, Krank, Feiertag; null = Soll pro Tag
    pauseAbStd: 6,        // über so viele Std Anwesenheit am Stück ...
    pauseMin: 45,         // ... werden so viele Min abgezogen
    urlaubTage: 0         // Urlaubstage pro Jahr; 0 = kein Urlaubskonto
  };
  let contract = { ...CONTRACT_DEFAULT };
  try { const c = JSON.parse(localStorage.getItem(LS_CONTRACT) || "null"); if (c) contract = { ...CONTRACT_DEFAULT, ...c }; } catch(e){}
  // Abgeleitete Werte, alle in Minuten
  let PAUSE_AB_MIN, PAUSE_MIN, WOCHE_MIN, WOCHE_MAX, TAGE_PRO_WOCHE, SOLL_TAG, GUTSCHRIFT;
  function applyContract(){
    WOCHE_MIN = Math.round(contract.wochenStd * 60);
    WOCHE_MAX = Math.max(WOCHE_MIN, Math.round(contract.maxStd * 60));
    TAGE_PRO_WOCHE = Math.min(7, Math.max(1, Math.round(contract.tage)));
    SOLL_TAG = WOCHE_MIN / TAGE_PRO_WOCHE;
    GUTSCHRIFT = contract.gutschriftStd == null ? SOLL_TAG : Math.round(contract.gutschriftStd * 60);
    PAUSE_AB_MIN = Math.round(contract.pauseAbStd * 60);
    PAUSE_MIN = Math.round(contract.pauseMin);
  }
  applyContract();
  // Stunden als kurzer Text, z. B. 19 oder 19,5
  const H = min => (min / 60).toLocaleString("de-DE", { maximumFractionDigits: 2 });
  const KINDS = {
    urlaub:   { label: "Urlaub",   hello: "Urlaub! Gönn dir was." },
    krank:    { label: "Krank",    hello: "Gute Besserung!" },
    feiertag: { label: "Feiertag", hello: "Feiertag! Genieß ihn." }
  };

  const LS_KEY = "stempelkarte:v1";
  const LS_VIEW = "stempelkarte:view";

  // ---------- Zustand ----------
  let state = { entries: [], active: null };
  let view = "hm";
  let tab = "clock";
  let docRef = null;

  try { const raw = localStorage.getItem(LS_KEY); if (raw) { const s = JSON.parse(raw); if (s && Array.isArray(s.entries)) state = { entries: s.entries, active: s.active || null }; } } catch(e){}
  try { const v = localStorage.getItem(LS_VIEW); if (v === "hm" || v === "dec") view = v; } catch(e){}
  // Abwesenheiten aus der Zeit vor den Vertrags-Einstellungen hatten immer 6:20 Std Gutschrift
  state.entries.forEach(e => { if (e.type && e.credit == null) e.credit = 380; });

  function save(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
    if (docRef) docRef.set({ entries: state.entries, active: state.active, v: 1 }).catch(()=>{});
  }

  // ---------- Rechnen ----------
  function netOf(presenceMin){ return presenceMin > PAUSE_AB_MIN ? presenceMin - PAUSE_MIN : presenceMin; }
  function pauseOf(presenceMin){ return presenceMin > PAUSE_AB_MIN ? PAUSE_MIN : 0; }
  function minsBetween(a, b){ return (b - a) / 60000; }
  // Abwesenheiten (Urlaub, Krank, Feiertag) haben start = end = Mittag des Tages und eine feste Gutschrift
  // Abwesenheiten behalten die Gutschrift, die beim Eintragen galt (credit); ältere Einträge nutzen die aktuelle
  function entryNet(e){ return e.type ? (e.credit ?? GUTSCHRIFT) : netOf(minsBetween(e.start, e.end)); }
  function vacation(year){
    const taken = state.entries.filter(e => e.type === "urlaub" && new Date(e.start).getFullYear() === year).length;
    return { total: contract.urlaubTage, taken, left: contract.urlaubTage - taken };
  }
  const absenceOn = ds => state.entries.find(e => e.type && dayStart(e.start) === ds);
  function presenceFor(need){ return need <= PAUSE_AB_MIN ? need : need + PAUSE_MIN; }

  // Text, z. B. "4 Std 32 Min" oder "4,53 Std"
  function fmt(min){
    const neg = min < 0; min = Math.abs(min);
    let out;
    if (view === "dec") {
      const h = Math.round(min / 60 * 100) / 100;
      out = h.toLocaleString("de-DE", { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + " Std";

      if (ds === undefined) { html += `<div class="day"><div class="imp"></div>Tag ${i + 1}</div>`; continue; }
      const live = s.a && dayStart(s.a.start) === ds;

      html += `<div class="day${ds === td ? " cur" : ""}"><div class="imp ${ds === td ? "today" : "done"}"><span>${dig(v)}</span><small>${ab ? KINDS[ab.type].label : "Std"}</small></div>${names[new Date(ds).getDay()]}</div>`;
    }
    $("week").style.setProperty("--n", slots);

  }

  function setActive(want){

      else say("Unter 1 Min, nicht gespeichert", undo);
      state.active = null; buzz(18);
    }
    save(); renderAll();
  }

  // ---------- Vergessen auszustempeln? ----------
  // Über 12 Std eingestempelt oder seit gestern (ab 4 Uhr früh) → nachfragen, einmal pro Schicht
  let askedFor = null;
  function checkForgot(){
    const a = state.active; if (!a || askedFor === a.start) return;
    const now = Date.now(), hrs = (now - a.start) / 36e5;
    const newDay = dayStart(now) > dayStart(a.start) && new Date(now).getHours() >= 4;
    if (hrs < 12 && !newDay) return;
    askedFor = a.start;
    const s = today();
    const guess = Math.min(s.goalAt || a.start + 6 * 36e5, a.start + 12 * 36e5);
    sheet("Vergessen auszustempeln?",
      `<p>Du bist seit ${dayLabel(a.start)}, ${clock(a.start)} eingestempelt (${Math.floor(hrs)} Std). Wann hast du wirklich aufgehört?</p>
       <div class="field"><label for="fg-end">Ende am ${dayLabel(a.start)}</label><input type="time" id="fg-end" value="${clock(guess)}"></div>
       <p class="preview" id="fg-prev"></p>`,
      [
        { label: "Läuft noch" },

          if (!end || end > Date.now()) { $("fg-prev").textContent = "Bitte eine Uhrzeit vor jetzt wählen"; $("fg-prev").className = "preview err"; return false; }
          const before = snapshot();
          state.entries.push({ id: "e" + end.toString(36), start: a.start, end }); state.active = null;
          save(); renderAll(); buzz(18); say("Aus · " + dig(netOf(minsBetween(a.start, end))) + " Std", () => restore(before));
        } }
      ]);
    const upd = () => { const end = endFrom(a.start, $("fg-end").value); const p = $("fg-prev");
      p.className = "preview"; p.textContent = end ? `Netto ${dig(netOf(minsBetween(a.start, end)))} Std${pauseOf(minsBetween(a.start, end)) ? ` · ${PAUSE_MIN} Min Pause` : ""}` : ""; };
    $("fg-end").addEventListener("input", upd); upd();
  }
  // Uhrzeit "HH:MM" als Ende nach dem Beginn (bei kleinerer Uhrzeit: Folgetag)
  function endFrom(start, hhmm){
    if (!hhmm) return null;
    const [h, m] = hhmm.split(":").map(Number);
    const d = new Date(start); d.setHours(h, m, 0, 0);
    if (d.getTime() <= start) d.setDate(d.getDate() + 1);
    return d.getTime();
  }

  // Schiebeschalter
  (function(){
    const track = $("track"), thumb = $("thumb"); let x0 = null, moved = false;
    const w = () => track.clientWidth / 2 - 5;
    track.addEventListener("pointerdown", e => { x0 = e.clientX; moved = false; track.setPointerCapture(e.pointerId); thumb.style.transition = "none"; buzz(5); });
    track.addEventListener("pointermove", e => {
      if (x0 === null) return; const dx = e.clientX - x0; if (Math.abs(dx) > 4) moved = true;
      thumb.style.transform = `translateX(${Math.max(0, Math.min(w(), (state.active ? w() : 0) + dx))}px)`;
    });

  // Beginn ändern
  // ---------- Feierabend-Planer ----------
  // Eingestempelt: Ende von jetzt bis 12 Std nach Beginn. Sonst: nächsten Tag mit Beginn und Ende planen.
  $("r-goal-btn").onclick = openPlanner;
  function openPlanner(){
    const s = today(), active = !!s.a, STEP = 5;
    const lastStart = [...state.entries].sort((x, y) => y.start - x.start)[0];
    const startDefault = lastStart ? clock(lastStart.start) : "08:00";
    const daysAfterBase = active ? s.daysLeft - 1 : s.daysLeftNext - 1;
    const baseWeek = s.prior;                       // Woche ohne die geplante Schicht
    const target = active ? s.dayTarget - (s.todayNet - s.net) : s.nextTarget;
    let start = active ? s.a.start : null;
    sheet(active ? "Feierabend planen" : "Nächsten Tag planen", `
      <div class="plan">
        <div class="lcd">
          <div class="lrow"><span id="pl-lbl">Wenn ich gehe um</span><span id="pl-pres">Anw. –</span></div>
          <div class="ldig" id="pl-time">--:--</div>
          <div class="lrow"><span id="pl-net">Netto –</span><span id="pl-pause">–</span></div>
        </div>
        ${active ? "" : `<div class="field" style="margin-bottom:12px"><label for="pl-start">Beginn</label><input type="time" id="pl-start" value="${startDefault}"></div>`}
        <div class="range"><input type="range" id="pl-range" step="${STEP}" aria-label="Ende"></div>
        <div class="scale"><span id="pl-min">–</span><span id="pl-max">–</span></div>
        <div class="chips" id="pl-chips"></div>
        <dl class="facts">
          <dt>Woche danach</dt><dd id="pl-week">–</dd>
          <dt>Restliche Tage</dt><dd id="pl-rest">–</dd>
        </dl>
        <p class="verdict" id="pl-verdict"></p>
      </div>`, [{ label: "Fertig", cls: "primary" }]);
    $("sheet-a").style.gridTemplateColumns = "1fr";
    const rg = $("pl-range");
    let lastStep = null;
    function bounds(){
      if (active) {
        const nowMin = Math.ceil(minsBetween(start, Date.now()) / STEP) * STEP;
        return [Math.max(STEP, nowMin), Math.max(nowMin + 60, 12 * 60)];
      }
      return [60, 12 * 60];
    }
    function startOf(){
      if (active) return start;
      const v = $("pl-start").value || "08:00", [h, m] = v.split(":").map(Number);
      const d = new Date(); d.setHours(h, m, 0, 0); return d.getTime();
    }
    function setRange(minutes){
      const [lo, hi] = bounds(); rg.min = lo; rg.max = hi;
      rg.value = Math.min(hi, Math.max(lo, Math.round(minutes / STEP) * STEP));
    }
    function chips(){
      const st = startOf(), list = [];
      if (target > 0) list.push(["Tagesziel", presenceFor(target)]);
      if (active) list.push(["Jetzt", minsBetween(st, Date.now())]);
      if (!active || minsBetween(st, Date.now()) < PAUSE_AB_MIN) list.push([`${H(PAUSE_AB_MIN)} Std, keine Pause`, PAUSE_AB_MIN]);
      if (!active || minsBetween(st, Date.now()) < presenceFor(Math.max(0, WOCHE_MAX - baseWeek))) list.push(["Max. Woche", presenceFor(Math.max(0, WOCHE_MAX - baseWeek))]);
      $("pl-chips").innerHTML = list.map(([l, v]) => `<button type="button" data-v="${Math.round(v)}">${l}</button>`).join("");
      $("pl-chips").querySelectorAll("button").forEach(b => b.onclick = () => { setRange(+b.dataset.v); upd(); buzz(8); });
    }
    function upd(){
      const st = startOf(), pres = +rg.value, net = netOf(pres), end = st + pres * 60000;
      const [lo, hi] = bounds();
      $("pl-min").textContent = clock(st + lo * 60000); $("pl-max").textContent = clock(st + hi * 60000);
      $("pl-time").textContent = clock(end);
      $("pl-pres").textContent = "Anw. " + dig(pres);
      $("pl-net").textContent = "Netto " + dig(net) + " Std";
      $("pl-pause").textContent = pauseOf(pres) ? "Pause −" + PAUSE_MIN : "Keine Pause";
      const weekAfter = baseWeek + net;
      const daysAfter = Math.max(0, daysAfterBase);
      $("pl-week").textContent = `${dig(weekAfter)} von ${H(WOCHE_MIN)} Std`;
      const missing = WOCHE_MIN - weekAfter;
      $("pl-rest").textContent = missing <= 0 ? "Nichts mehr nötig" : daysAfter ? `${dig(missing / daysAfter)} Std × ${daysAfter}` : `Es fehlen ${dig(missing)}`;
      const v = $("pl-verdict");
      if (pres > PAUSE_AB_MIN && pres < PAUSE_AB_MIN + PAUSE_MIN) {
        v.className = "verdict warn"; v.textContent = `Pausenfalle: Wegen der ${PAUSE_MIN} Min Pause hast du weniger als beim Gehen um ${clock(st + PAUSE_AB_MIN * 60000)}. Gleich viel erst ab ${clock(st + (PAUSE_AB_MIN + PAUSE_MIN) * 60000)}.`;
      } else if (weekAfter > WOCHE_MAX) {
        v.className = "verdict warn"; v.textContent = `Zu viel: ${dig(weekAfter - WOCHE_MAX)} Std über ${H(WOCHE_MAX)}. Spätestens um ${clock(st + presenceFor(Math.max(0, WOCHE_MAX - baseWeek)) * 60000)} gehen.`;
      } else if (weekAfter >= WOCHE_MIN) {
        v.className = "verdict ok"; v.textContent = daysAfter ? "Woche schon im Ziel. Die restlichen Tage kannst du frei lassen." : "Woche im Ziel. Perfekt!";
      } else if (!daysAfter) {
        v.className = "verdict warn"; v.textContent = `Letzter Tag: Es fehlen dann noch ${dig(missing)} Std bis ${H(WOCHE_MIN)}. Gehe frühestens um ${clock(st + presenceFor(WOCHE_MIN - baseWeek) * 60000)}.`;
      } else if (net >= target - .5) {
        v.className = "verdict ok"; v.textContent = `Tagesziel geschafft. Danach noch ${dig(missing / daysAfter)} Std an ${daysAfter === 1 ? "einem Tag" : daysAfter + " Tagen"}.`;
      } else {
        v.className = "verdict"; v.textContent = `Unter dem Tagesziel. Die restlichen ${daysAfter === 1 ? "Tag muss" : daysAfter + " Tage müssen"} dann je ${dig(missing / daysAfter)} Std schaffen.`;
      }
      const step = Math.round(pres / 15); if (lastStep !== null && step !== lastStep) buzz(4); lastStep = step;
    }
    setRange(target > 0 ? presenceFor(target) : (active ? minsBetween(start, Date.now()) : 6 * 60));
    chips(); upd();
    rg.addEventListener("input", upd);
    if (!active) $("pl-start").addEventListener("input", () => { chips(); upd(); });
  }

  $("r-start-btn").onclick = () => {

      { label: "Abbrechen" },

  // Monster antippen
  const LINES = ["Rawr!", "Hallo!", "Ich zähl mit.", "Noch einen Kaffee?", "Weiter so!"];
  cv.addEventListener("click", () => { jumpT = performance.now() + 520; buzz(8); tapMsg = LINES[Math.floor(Math.random() * LINES.length)]; tapUntil = Date.now() + 2200; });

  // ---------- Rechner ----------
  const $cd = $("c-date"), $cs = $("c-start"), $ce = $("c-end");
  const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  $cd.value = todayISO();

  function calcRange(){
    if (!$cs.value || !$ce.value || !$cd.value) return null;
    const [y, mo, da] = $cd.value.split("-").map(Number);
    const [sh, sm] = $cs.value.split(":").map(Number), [eh, em] = $ce.value.split(":").map(Number);
    const s = new Date(y, mo - 1, da, sh, sm).getTime();
    let e = new Date(y, mo - 1, da, eh, em).getTime();
    if (e <= s) e += 864e5; // über Mitternacht
    return { s, e, overnight: new Date(e).getDate() !== new Date(s).getDate() };
  }
  let calcKind = "work";
  document.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => {
    calcKind = b.dataset.kind; buzz(5);
    document.querySelectorAll("[data-kind]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    $("c-msg").textContent = ""; $("c-msg").className = "msg"; renderCalc();
  });
  const noonOf = iso => new Date(iso + "T12:00").getTime();
  function renderCalc(){
    $("c-day").textContent = $cd.value ? dayLabel(noonOf($cd.value)) : "–";
    $("c-rule").textContent = PAUSE_MIN ? `${PAUSE_MIN} Min Pause ab ${H(PAUSE_AB_MIN)} Std` : "Ohne Pausenabzug";
    $("c-times").hidden = calcKind !== "work";
    if (calcKind !== "work") {
      const k = KINDS[calcKind];
      $("c-net").textContent = dig(GUTSCHRIFT); $("c-net").classList.remove("dim");
      const vac = $cd.value ? vacation(+$cd.value.slice(0, 4)) : null;
      $("c-pres").textContent = calcKind === "urlaub" && contract.urlaubTage && vac ? `Gutschrift · noch ${vac.left} Urlaubstage` : "Gutschrift netto"; $("c-pause").textContent = k.label;
      $("c-save").textContent = `${k.label} eintragen`; $("c-save").disabled = !$cd.value; return;

  [$cd, $cs, $ce].forEach(el => el.addEventListener("input", () => { $("c-msg").textContent = ""; $("c-msg").className = "msg"; renderCalc(); }));
  function storeCalc(r){
    const before = snapshot();
    state.entries.push({ id: "m" + Date.now().toString(36), start: r.s, end: r.e });
    save(); renderAll(); buzz([10, 40, 10]);
    $("c-msg").textContent = `Gespeichert: ${dayLabel(r.s)}, ${fmt(netOf(minsBetween(r.s, r.e)))}`; $("c-msg").className = "msg ok";
    say("Gespeichert", () => { restore(before); $("c-msg").textContent = ""; });
  }
  function storeAbsence(iso, kind){
    const before = snapshot(), t = noonOf(iso);
    state.entries.push({ id: "a" + Date.now().toString(36), type: kind, start: t, end: t, credit: GUTSCHRIFT });
    save(); renderAll(); buzz([10, 40, 10]);
    $("c-msg").textContent = `Eingetragen: ${dayLabel(t)}, ${KINDS[kind].label}, ${fmt(GUTSCHRIFT)}`; $("c-msg").className = "msg ok";
    say(KINDS[kind].label + " eingetragen", () => { restore(before); $("c-msg").textContent = ""; });
  }
  $("c-save").onclick = () => {
    if (calcKind !== "work") {
      if (!$cd.value) return;
      const kind = calcKind, iso = $cd.value, ds = dayStart(noonOf(iso));

  // ---------- Verlauf ----------

    const sorted = [...state.entries].sort((a, b) => b.start - a.start);
    const groups = new Map();
    sorted.forEach(e => { const k = weekStart(e.start); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); });
    let html = "";

      const nDays = new Set(list.map(e => dayStart(e.start))).size, soll = nDays * SOLL_TAG, diff = sum - soll;

      list.forEach(e => {
        const pres = minsBetween(e.start, e.end);

        { label: "Abbrechen" },
        { label: "Löschen", cls: "danger", run: () => { const before = snapshot(); state.entries = state.entries.filter(x => x.id !== e.id); save(); renderAll(); buzz(18); say("Gelöscht", () => restore(before)); } }
      ]);

  const isoDate = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  function editEntry(id){
    const e = state.entries.find(x => x.id === id); if (!e) return;
    if (e.type) return editAbsence(e);
    const read = () => {
      const dv = $("ed-date").value, sv = $("ed-start").value, ev = $("ed-end").value;
      if (!dv || !sv || !ev) return null;
      const [y, mo, da] = dv.split("-").map(Number), [sh, sm] = sv.split(":").map(Number);

    };
    sheet("Eintrag bearbeiten",
      `<div class="fieldset">
         <div class="field"><label for="ed-date">Datum</label><input type="date" id="ed-date" value="${isoDate(e.start)}"></div>

      [
        { label: "Abbrechen" },

      const pres = minsBetween(e.start, e.end), net = roundNet(e), ds = dayStart(e.start);

      const lastOfDay = i === list.length - 1 || dayStart(list[i + 1].start) !== ds;
      const row = { e, date: dmy(e.start), wd: WD[new Date(e.start).getDay()],

     `Erstellt am ${dmy(Date.now())} mit TICKO`].forEach((t, i) => {

  async function shareFile(blob, filename){

      try { await navigator.share({ files: [file], title: filename }); return true; }
      catch (err) { if (err && err.name === "AbortError") return false; }

    // Fallback (z. B. am Computer): als Download speichern
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return true;
  }

        <div class="kinds two" id="ex-fmt"><button type="button" data-v="pdf" aria-pressed="true">PDF</button><button type="button" data-v="xlsx" aria-pressed="false">Excel</button></div>
      </div>
      <div class="setting field"><label for="ex-name">Name auf dem Stundenzettel</label><input type="text" id="ex-name" autocomplete="name" placeholder="Vor- und Nachname" value="${name.replace(/"/g, "&quot;")}"></div>
      <p class="preview" id="ex-msg"></p>`,
      [{ label: "Abbrechen" }, { label: "Teilen", cls: "primary", run: () => {
        const nm = $("ex-name").value.trim(); try { localStorage.setItem(LS_NAME, nm); } catch(e){}
        const base = `Stundenzettel-${y}-${String(m + 1).padStart(2, "0")}`;
        if (fmtSel === "pdf") {
          if (!pdfLib) { $("ex-msg").textContent = "PDF-Modul lädt noch. Bitte gleich nochmal tippen (einmalig Internet nötig)."; $("ex-msg").className = "preview err"; loadPdfLib().catch(() => {}); return false; }
          shareFile(buildPdf(y, m, nm), base + ".pdf");
        } else {
          if (!xlsBlob || xlsBusy) { $("ex-msg").textContent = "Tabelle wird vorbereitet. Bitte gleich nochmal tippen."; $("ex-msg").className = "preview"; prepXlsx(); return false; }
          shareFile(xlsBlob, base + ".xlsx");
        }
      } }]);
    function upd(){
      $("ex-month").textContent = `${MONTHS[m]} ${y}`;
      const R = monthRows(y, m);
      $("ex-days").textContent = R.n ? `${R.days} ${R.days === 1 ? "Tag" : "Tage"}` : "Keine Einträge";
      $("ex-total").textContent = R.n ? `Ist ${dec2(R.total)} · Soll ${dec2(R.soll)} · ${decSigned(R.diff)}` : "";
      $("ex-prev").disabled = y * 12 + m <= first.getFullYear() * 12 + first.getMonth();
      $("ex-next").disabled = y * 12 + m >= now.getFullYear() * 12 + now.getMonth();
      prepXlsx();
    }
    $("ex-prev").onclick = () => { if (--m < 0) { m = 11; y--; } buzz(5); upd(); };
    $("ex-next").onclick = () => { if (++m > 11) { m = 0; y++; } buzz(5); upd(); };
    $("ex-fmt").querySelectorAll("button").forEach(b => b.onclick = () => { fmtSel = b.dataset.v; buzz(5); $("ex-msg").textContent = ""; $("ex-fmt").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); prepXlsx(); });
    $("ex-name").addEventListener("change", prepXlsx);
    upd();
  };

  // ---------- Einstellungen ----------
  $("btn-settings").onclick = () => {
    buzz(6);
    const seg = (name, opts, cur) => `<div class="kinds${opts.length === 2 ? " two" : ""}" data-set="${name}">${opts.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${v === cur}">${l}</button>`).join("")}</div>`;
    sheet("Einstellungen", `
      <div class="setting"><h3>Erscheinungsbild</h3>${seg("theme", [["auto", "Automatisch"], ["light", "Hell"], ["dark", "Dunkel"]], theme)}</div>
      <div class="setting"><h3>Farbe</h3>
        <div class="swatches" data-set="palette">
          <button type="button" class="swatch classic" data-v="classic" aria-pressed="${palette === "classic"}"><span class="chip"><i></i><i></i></span>Klassik</button>
          <button type="button" class="swatch pink" data-v="pink" aria-pressed="${palette === "pink"}"><span class="chip"><i></i><i></i></span>Pink</button>
        </div>
      </div>
      <div class="setting"><h3>Arbeitsvertrag</h3>
        <div class="contract">
          <div class="field"><label for="ct-wochen">Std pro Woche</label><input type="text" inputmode="decimal" id="ct-wochen" value="${H(WOCHE_MIN)}"></div>
          <div class="field"><label for="ct-max">Höchstens</label><input type="text" inputmode="decimal" id="ct-max" value="${H(WOCHE_MAX)}"></div>
          <div class="field"><label for="ct-tage">Tage pro Woche</label><input type="text" inputmode="numeric" id="ct-tage" value="${TAGE_PRO_WOCHE}"></div>
          <div class="field"><label>Soll pro Tag</label><output id="ct-soll"></output></div>
          <div class="field"><label for="ct-pab">Pause ab (Std)</label><input type="text" inputmode="decimal" id="ct-pab" value="${H(PAUSE_AB_MIN)}"></div>
          <div class="field"><label for="ct-pmin">Pause (Min)</label><input type="text" inputmode="numeric" id="ct-pmin" value="${PAUSE_MIN}"></div>
          <div class="field"><label for="ct-gut">Gutschrift (Std)</label><input type="text" inputmode="decimal" id="ct-gut" value="${contract.gutschriftStd == null ? "" : H(GUTSCHRIFT)}"></div>
          <div class="field"><label for="ct-urlaub">Urlaubstage / Jahr</label><input type="text" inputmode="numeric" id="ct-urlaub" value="${contract.urlaubTage || ""}" placeholder="–"></div>
        </div>
        <p class="preview" id="ct-info"></p>
      </div>
      <div class="setting"><h3>Zeitformat</h3>${seg("view", [["hm", "Std : Min"], ["dec", "Dezimal"]], view)}</div>`,
      [{ label: "Fertig", cls: "primary" }]);
    $("sheet-a").style.gridTemplateColumns = "1fr";
    $("sheet-b").querySelectorAll("[data-set]").forEach(group => group.querySelectorAll("button").forEach(b => b.onclick = () => {
      group.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      const v = b.dataset.v, what = group.dataset.set; buzz(6);
      if (what === "theme") { theme = v; applyAppearance(); }
      if (what === "palette") { palette = v; applyAppearance(); }
      if (what === "view") setView(v);
    }));
    // Arbeitsvertrag: jede gültige Eingabe gilt sofort und wird gespeichert
    const num = id => { const v = $(id).value.trim().replace(",", "."); return v === "" ? null : Number(v); };
    function contractInfo(){
      $("ct-soll").textContent = dec2(SOLL_TAG) + " Std";
      $("ct-gut").placeholder = "auto " + dec2(SOLL_TAG);
      const v = vacation(new Date().getFullYear());
      $("ct-info").className = "preview";
      $("ct-info").textContent = contract.urlaubTage ? `Urlaub ${new Date().getFullYear()}: ${v.taken} genommen, ${v.left} übrig` : "Gutschrift gilt für Urlaub, Krank und Feiertag. Urlaubstage eintragen, um dein Urlaubskonto zu sehen.";
    }
    function readContract(){
      const c = { ...contract }, bad = [];
      const w = num("ct-wochen"), mx = num("ct-max"), t = num("ct-tage"), pab = num("ct-pab"), pm = num("ct-pmin"), g = num("ct-gut"), u = num("ct-urlaub");
      if (w > 0 && w <= 80) c.wochenStd = w; else bad.push("Std pro Woche");
      if (mx === null) c.maxStd = c.wochenStd; else if (mx >= c.wochenStd && mx <= 80) c.maxStd = mx; else bad.push("Höchstens (mind. Std pro Woche)");
      if (Number.isInteger(t) && t >= 1 && t <= 7) c.tage = t; else bad.push("Tage pro Woche (1–7)");
      if (pab !== null && pab >= 0 && pab <= 24) c.pauseAbStd = pab; else bad.push("Pause ab");
      if (pm !== null && pm >= 0 && pm <= 180) c.pauseMin = pm; else bad.push("Pause (Min)");
      if (g === null) c.gutschriftStd = null; else if (g >= 0 && g <= 24) c.gutschriftStd = g; else bad.push("Gutschrift");
      if (u === null) c.urlaubTage = 0; else if (Number.isInteger(u) && u >= 0 && u <= 365) c.urlaubTage = u; else bad.push("Urlaubstage");
      contract = c; applyContract();
      try { localStorage.setItem(LS_CONTRACT, JSON.stringify(contract)); } catch(e){}
      shown = ""; renderAll(); contractInfo();
      if (bad.length) { $("ct-info").textContent = "Bitte prüfen: " + bad.join(", "); $("ct-info").className = "preview err"; }
    }
    ["ct-wochen", "ct-max", "ct-tage", "ct-pab", "ct-pmin", "ct-gut", "ct-urlaub"].forEach(id => $(id).addEventListener("input", readContract));
    contractInfo();
  };

  // ---------- Startbildschirm ----------
  // Begrüßung nach Tageszeit; das Monster reagiert passend und winkt
  function greeting(h){
    if (h >= 4 && h < 11) return { t: "Guten Morgen", sub: "Kaffee schon in Reichweite?", eyes: "wake" };
    if (h >= 11 && h < 17) return { t: "Mahlzeit", sub: "Gut gestärkt in den Tag?", eyes: "happy" };
    if (h >= 17 && h < 22) return { t: "Guten Abend", sub: "Noch fleißig unterwegs?", eyes: "open" };
    return { t: "Guten Abend,<br>Nachteule", sub: "So spät noch wach?", eyes: "wide" };
  }
  let splashOn = false;
  function openSplash(){
    const g = greeting(new Date().getHours()), s = today();
    $("sp-greet").innerHTML = g.t; $("sp-sub").textContent = g.sub;
    $("sp-date").textContent = new Date().toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
    if (s.a) { $("sp-i1l").firstChild.textContent = "Eingestempelt seit"; $("sp-i1").textContent = clock(s.a.start); }
    else if (s.todayNet) { $("sp-i1l").firstChild.textContent = "Heute schon"; $("sp-i1").textContent = dig(s.todayNet); }
    else { $("sp-i1l").firstChild.textContent = s.week >= WOCHE_MIN ? "Woche" : "Ziel heute"; $("sp-i1").textContent = s.week >= WOCHE_MIN ? "geschafft" : dig(s.nextTarget); }
    $("sp-i1").style.fontSize = /[a-z]/.test($("sp-i1").textContent) ? "17px" : "";
    $("sp-i2").textContent = `${dig(s.week)}/${H(WOCHE_MIN)}`;
    $("sp-go-t").textContent = s.a ? "Weiter zum Arbeitstag" : "Arbeitstag starten";
    splashOn = true; splashT0 = performance.now(); splashEyes = g.eyes;
    requestAnimationFrame(splashLoop);
  }
  let spLast = 0;
  function splashLoop(t){ if (!splashOn) return; drawSplash(t); requestAnimationFrame(splashLoop); }
  // Falls der Browser keine Animationsframes liefert, trotzdem zeichnen
  setInterval(() => { const t = performance.now(); if (splashOn && t - spLast > 900) drawSplash(t); }, 1000);
  // Monster groß zeichnen (eigenes kleines Display)
  const spcv = $("sp-cv"), spx = spcv.getContext("2d");
  let splashT0 = 0, splashEyes = "open";
  function drawSplash(t){
    spLast = t;
    const w = spcv.clientWidth, h = spcv.clientHeight, dpr = Math.min(3, window.devicePixelRatio || 1);
    if (w && h) {
      if (spcv.width !== Math.round(w * dpr)) { spcv.width = Math.round(w * dpr); spcv.height = Math.round(h * dpr); }
      const cols = 25, cell = Math.min(spcv.width / cols, spcv.height / 20), rows = Math.floor(spcv.height / cell);
      const ox = (spcv.width - cols * cell) / 2, oy = (spcv.height - rows * cell) / 2;
      const grid = new Uint8Array(cols * rows);
      const putS = (x, y, v) => { if (x >= 0 && x < cols && y >= 0 && y < rows && v > grid[y * cols + x]) grid[y * cols + x] = v; };
      const spr = (rws, x, y) => rws.forEach((r, j) => { for (let i = 0; i < r.length; i++) { if (r[i] === "#") putS(x + i, y + j, 2); else if (r[i] === "+") putS(x + i, y + j, 1); } });
      const el = t - splashT0;
      // Augen: morgens erst verschlafen, dann wach; zwischendurch blinzeln
      let eyes = splashEyes === "wake" ? (el < 1400 ? "shut" : "open") : splashEyes;
      if (Math.floor(el / 3200) !== Math.floor((el - 140) / 3200) || (el % 3200) < 140) eyes = eyes === "shut" ? eyes : "blink";
      const mouth = eyes === "happy" || splashEyes === "happy" ? "grin" : eyes === "wide" ? "oh" : eyes === "shut" ? "sleep" : "smile";
      const waving = el > 600 && el < 3600, armsUp = waving && Math.floor(el / 260) % 2 === 0;
      const bob = Math.round(Math.sin(el / 420) * .6);
      const mx = Math.floor((cols - 15) / 2), my = Math.floor((rows - 16) / 2) + 1 + bob;
      BODY.forEach((r, j) => { if (r) spr([r], mx, my + j); });
      if (C.bow) spr(C.square ? BOW.map(r => r.replace(/#/g, "+")) : BOW, mx + 5, my - 1);
      spr(EYES[eyes], mx, my + 5); spr(MOUTH[mouth], mx, my + 9); spr(LEGS[0], mx, my + 14);
      spr(ARMS, mx, my + (armsUp ? 2 : 10));
      if (splashEyes === "wake" && el < 1400) { const z = Math.floor(el / 350) % 3; spr(Z, mx + 16, my - 1 + z); }
      if (splashEyes === "wide") { spr(MOON, cols - 5, 1); }
      if (splashEyes === "happy" || splashEyes === "wake") spr(SUN, cols - 6, 1);
      // zeichnen
      spx.fillStyle = C.bg; spx.fillRect(0, 0, spcv.width, spcv.height);
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const v = grid[y * cols + x], cx = ox + (x + .5) * cell, cy = oy + (y + .5) * cell;
        spx.fillStyle = v === 2 ? C.full : v === 1 ? C.half : C.off;
        if (C.square) { const q = cell * .9; spx.fillRect(cx - q / 2, cy - q / 2, q, q); }
        else { spx.beginPath(); spx.arc(cx, cy, cell * (v ? .4 : .34), 0, 6.2832); spx.fill(); }
      }
      if (C.glow) { spx.save(); spx.globalCompositeOperation = "lighter"; spx.globalAlpha = C.glow * .3; spx.filter = `blur(${cell * .3}px)`; spx.drawImage(spcv, 0, 0); spx.restore(); }
    }
  }
  function closeSplash(){
    const b = $("sp-go"); b.classList.add("pressed"); buzz([12, 30, 18]);
    setTimeout(() => $("splash").classList.add("leave"), 140);
    setTimeout(() => { $("splash").hidden = true; splashOn = false; requestAnimationFrame(fitCanvas); checkForgot(); }, 900);
  }
  $("sp-go").onclick = closeSplash;

  // ---------- Start ----------
  // Bei offener Tastatur bleibt das Sheet über ihr
  if (window.visualViewport) {
    const vv = window.visualViewport;
    const lift = () => { const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop); $("sheet").style.bottom = (kb > 80 ? kb + 8 : 8) + "px"; };
    vv.addEventListener("resize", lift); vv.addEventListener("scroll", lift);
  }
  document.addEventListener("focusin", e => { if (e.target.closest && e.target.closest("#sheet-b")) setTimeout(() => e.target.scrollIntoView({ block: "center", behavior: "smooth" }), 300); });
  // Das Gerät darf nie verrutschen (z. B. wenn iOS ein fokussiertes Feld ins Bild schieben will)
  $("dev").addEventListener("scroll", e => { if (e.target.scrollTop) e.target.scrollTop = 0; });
  applyAppearance(); fitCanvas(); renderAll(); openSplash();
  (function reveal(){
    const t0 = performance.now(), MIN = 350, MAX = 900;
    const fonts = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('900 40px "Doto"'), document.fonts.load('600 12px "Chivo Mono"')]) : Promise.resolve();
    Promise.race([fonts.catch(() => {}), new Promise(r => setTimeout(r, MAX))]).then(() => {
      setTimeout(() => {
        $("splash").classList.add("ready");
        $("boot").classList.add("out");
        setTimeout(() => $("boot").remove(), 600);
        requestAnimationFrame(fitCanvas);
      }, Math.max(0, MIN - (performance.now() - t0)));
    });
  })();
  addEventListener("resize", fitCanvas);
  if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe(cv);
  // Kein Zoomen per Geste (iOS)
  ["gesturestart", "gesturechange"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
  let last = 0;
  (function loop(t){
    if (tab === "clock" && t - last > 33) { draw(t); last = t; }
    requestAnimationFrame(loop);
  })(0);
  // Falls der Browser keine Animationsframes liefert, trotzdem regelmäßig zeichnen
  setInterval(() => { const t = performance.now(); if (tab === "clock" && t - last > 900) { draw(t); last = t; } }, 1000);
  setInterval(() => { if (!document.hidden) renderClock(); }, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { renderAll(); checkForgot(); } });
  document.fonts && document.fonts.ready.then(fitCanvas);

  // ---------- Synchronisierung über claude.ai (falls verfügbar) ----------
  const $sync = $("sync");
  $sync.textContent = "Daten werden nur auf diesem Gerät gespeichert";
  (async () => {
    if (!window.claude || typeof window.claude.use !== "function") return;
    try {
      const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!d || !u) return;
      const uid = await u.id(); if (!uid) return;
      const ref = d.doc("data/users/" + uid + "/stempelkarte");
      const snap = await ref.get();
      if (snap.exists) {
        const data = snap.data() || {};
        state = { entries: Array.isArray(data.entries) ? data.entries.slice() : [], active: data.active ? { start: data.active.start } : null };
        try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
      }
      docRef = ref;
      if (!snap.exists) save();
      $sync.textContent = "Daten sind mit deinem Claude-Konto synchronisiert";
      renderAll();
    } catch (e) { /* bleibt lokal */ }
  })();
})();

// ---------- Offline-Unterstützung ----------
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
