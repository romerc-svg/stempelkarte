<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stempelkarte">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" id="meta-theme" content="#D8D5CF">
<script>
  // Gespeichertes Erscheinungsbild sofort setzen, damit nichts aufblitzt
  try {
    var t = localStorage.getItem("stempelkarte:theme"), p = localStorage.getItem("stempelkarte:palette");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    if (p === "pink") document.documentElement.dataset.palette = "pink";
  } catch (e) {}
</script>
<title>Stempelkarte</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=Chivo+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Ein Gerät ("SK-1"): oben die Platte mit LED-Matrix, darunter der Bildschirm-Inhalt, unten drei Tasten.
   Auf dem Handy randlos, am Desktop als Gerät im Rahmen. */
:root{
  --stage:#121210;
  --body:#D8D5CF; --panel:#ECEAE5; --edge:#B9B5AD; --well:#C9C5BD; --ink:#24231F; --muted:#77736B; --faint:#9E998F;
  --lcd:#140F0B; --led:#FF5B23; --led-half:#8E3416; --led-off:#2B1A12; --ok:#2F7A4B;
  --lcd-shadow:rgba(0,0,0,.7); --lrow:#C9542A; --glow-txt:rgba(255,91,35,.45); --glow-a:.4; --px-square:0;
  --accent:#FF5B23; --accent-fg:#fff; --danger:#FF5B23; --danger-edge:#B53A10;
  --hi:#fff; --hi-strong:#fff; --knob1:#F8F6F2; --knob2:#DCD8D1; --dot:#B7B2A9;
  --main-bg:#24231F; --main-fg:#ECEAE5; --main-label:#A7A298;
  --glitter:0; --bow:0;
  color-scheme:light;
  --mono:"Chivo Mono", ui-monospace, Menlo, monospace;
  --dots:"Doto", ui-monospace, Menlo, monospace;
  --sys:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --spring:cubic-bezier(.3,1.5,.5,1);
}
/* Dunkelmodus: dunkles Gehäuse, Display im klassischen Game-Boy-Grün */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --stage:#0A0A09;
    --body:#1D1E1B; --panel:#2A2B27; --edge:#111210; --well:#151613; --ink:#ECE9E0; --muted:#9A968C; --faint:#6E6B63;
    --lcd:#A4C21A; --led:#0B2B0B; --led-half:#3E7A2E; --led-off:#9BB916; --ok:#9BBC0F; --px-square:1;
    --lcd-shadow:rgba(0,0,0,.45); --lrow:#1F4A1A; --glow-txt:transparent; --glow-a:0;
    --accent:#9BBC0F; --accent-fg:#0F380F; --danger:#E5533D; --danger-edge:#8E2A1B;
    --hi:rgba(255,255,255,.07); --hi-strong:#5A5C54; --knob1:#45473F; --knob2:#33352F; --dot:#4A4C45;
    --main-bg:#0F380F; --main-fg:#9BBC0F; --main-label:#8BAC0F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --stage:#0A0A09;
    --body:#1D1E1B; --panel:#2A2B27; --edge:#111210; --well:#151613; --ink:#ECE9E0; --muted:#9A968C; --faint:#6E6B63;
    --lcd:#A4C21A; --led:#0B2B0B; --led-half:#3E7A2E; --led-off:#9BB916; --ok:#9BBC0F; --px-square:1;
    --lcd-shadow:rgba(0,0,0,.45); --lrow:#1F4A1A; --glow-txt:transparent; --glow-a:0;
    --accent:#9BBC0F; --accent-fg:#0F380F; --danger:#E5533D; --danger-edge:#8E2A1B;
    --hi:rgba(255,255,255,.07); --hi-strong:#5A5C54; --knob1:#45473F; --knob2:#33352F; --dot:#4A4C45;
    --main-bg:#0F380F; --main-fg:#9BBC0F; --main-label:#8BAC0F;
  color-scheme:dark;
}
/* Pink („Barbie“): hell mit pink leuchtender LED, dunkel mit zuckerrosa Display; dezenter Glitzer */
:root[data-palette="pink"]{
  --stage:#2A0F1E;
  --body:#F7C6DC; --panel:#FFE4F0; --edge:#E79BBE; --well:#F2B5D0; --ink:#4A0F2E; --muted:#A04A75; --faint:#C77DA0;
  --lcd:#2B0618; --led:#FF4FB3; --led-half:#9C2468; --led-off:#3E0C25; --ok:#C2187A; --px-square:0;
  --lcd-shadow:rgba(60,0,30,.7); --lrow:#FF8AC9; --glow-txt:rgba(255,79,179,.55); --glow-a:.5;
  --accent:#E0218A; --accent-fg:#fff; --danger:#D7263D; --danger-edge:#8E1426;
  --hi:#fff; --hi-strong:#fff; --knob1:#FFF5FA; --knob2:#F6CFE1; --dot:#E8A9C6;
  --main-bg:#E0218A; --main-fg:#fff; --main-label:#FFD0E8;
  --glitter:1; --bow:1; color-scheme:light;
  --sp1:rgba(255,255,255,.95); --sp2:rgba(255,255,255,.7); --sp3:rgba(255,190,225,.9);
}
@media (prefers-color-scheme:dark){
  :root[data-palette="pink"]:not([data-theme="light"]){
    --stage:#0E0509;
    --body:#2A1120; --panel:#3A1A2D; --edge:#160810; --well:#200C18; --ink:#FFE1EF; --muted:#D08BAE; --faint:#8E5574;
    --lcd:#FFB8DA; --led:#5C0A35; --led-half:#C2307E; --led-off:#F7A8CF; --ok:#FF7AC2; --px-square:1;
    --lcd-shadow:rgba(0,0,0,.45); --lrow:#7A1446; --glow-txt:transparent; --glow-a:0;
    --accent:#FF5CB8; --accent-fg:#3A0A22; --danger:#FF4D6D; --danger-edge:#8E1A30;
    --hi:rgba(255,255,255,.08); --hi-strong:#7A4A63; --knob1:#5A2E45; --knob2:#43213A; --dot:#5C3249;
    --main-bg:#5C0A35; --main-fg:#FFB8DA; --main-label:#F7A8CF;
    --glitter:.6; --bow:1; color-scheme:dark;
    --sp1:rgba(255,190,225,.22); --sp2:rgba(255,255,255,.12); --sp3:rgba(255,120,190,.2);
  }
}
:root[data-palette="pink"][data-theme="dark"]{
    --stage:#0E0509;
    --body:#2A1120; --panel:#3A1A2D; --edge:#160810; --well:#200C18; --ink:#FFE1EF; --muted:#D08BAE; --faint:#8E5574;
    --lcd:#FFB8DA; --led:#5C0A35; --led-half:#C2307E; --led-off:#F7A8CF; --ok:#FF7AC2; --px-square:1;
    --lcd-shadow:rgba(0,0,0,.45); --lrow:#7A1446; --glow-txt:transparent; --glow-a:0;
    --accent:#FF5CB8; --accent-fg:#3A0A22; --danger:#FF4D6D; --danger-edge:#8E1A30;
    --hi:rgba(255,255,255,.08); --hi-strong:#7A4A63; --knob1:#5A2E45; --knob2:#43213A; --dot:#5C3249;
    --main-bg:#5C0A35; --main-fg:#FFB8DA; --main-label:#F7A8CF;
    --glitter:.6; --bow:1; color-scheme:dark;
    --sp1:rgba(255,190,225,.22); --sp2:rgba(255,255,255,.12); --sp3:rgba(255,120,190,.2);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
html{position:fixed;inset:0;width:100%}
body{background:var(--body);color:var(--ink);font-family:var(--mono);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;touch-action:manipulation}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.device{height:100%;display:flex;flex-direction:column;background:var(--body);position:relative;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px)}
.device :not(input){-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (min-width:600px){
  body{background:var(--stage);display:grid;place-items:center;padding:20px}
  .device{width:400px;height:min(860px,calc(100vh - 40px));border-radius:48px;padding-top:28px;
    box-shadow:0 0 0 11px #1A1A18,0 0 0 12px #36352F,0 40px 80px -30px rgba(0,0,0,.8)}
}

/* ---------- Bildschirme ---------- */
.screen{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding-bottom:12px}
.screen::-webkit-scrollbar{display:none}
.screen[hidden]{display:none}

/* ---------- Platte & Display ---------- */
.plate{margin:8px 14px 0;background:var(--panel);border-radius:28px;padding:14px 14px 12px;position:relative;flex:none;
  box-shadow:inset 0 1px 0 var(--hi),inset 0 -2px 0 var(--edge),0 1px 2px rgba(0,0,0,.08)}
.screw{position:absolute;width:9px;height:9px;border-radius:50%;top:11px;background:radial-gradient(circle at 35% 35%,var(--hi-strong),var(--edge));box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.screw::after{content:"";position:absolute;left:1px;right:1px;top:4px;height:1px;background:rgba(0,0,0,.35);transform:rotate(35deg)}
.screw.l{left:11px}.screw.r{right:11px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:0 12px 10px 16px;min-height:26px}
.brand b{font-weight:600}
.fmt{display:flex;background:var(--well);border-radius:9px;padding:2px;box-shadow:inset 0 1px 3px rgba(0,0,0,.18)}
.fmt button{font-size:10px;letter-spacing:.1em;padding:4px 8px;border-radius:7px;color:var(--muted)}
.fmt button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 0 var(--edge)}
.lcd{background:var(--lcd);border-radius:16px;padding:10px 10px 9px;box-shadow:inset 0 3px 12px var(--lcd-shadow),0 1px 0 var(--hi);position:relative;overflow:hidden;color:var(--led)}
.lcd::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.07),transparent 40%);pointer-events:none}
/* Die Stempeluhr-Platte wächst mit dem freien Platz, das Display füllt sie */
#scr-clock .plate{flex:1 1 auto;min-height:190px;display:flex;flex-direction:column}
#scr-clock .lcd{flex:1;min-height:0;display:flex;flex-direction:column}
.scene{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
#scr-clock .switchwrap{margin-top:14px}
/* Verlauf: nur die Liste scrollt, im eigenen Fenster */
.list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;padding-bottom:6px;
  -webkit-mask-image:linear-gradient(transparent,#000 12px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(transparent,#000 12px,#000 calc(100% - 18px),transparent)}
.list::-webkit-scrollbar{display:none}
/* Kleine Bildschirme (z. B. iPhone SE): alles etwas kompakter */
@media (max-height:720px){
  .plate{padding:10px 12px 10px}
  .brand{padding-bottom:7px}
  .read{margin-top:9px}.read > *{padding:7px 9px 6px}.read b{font-size:22px}
  .weekhead{margin:10px 18px 6px}
  .imp{width:min(100%,62px);font-size:15px}.imp small{display:none}
  .track{height:56px}.thumb{height:46px}
  .switchwrap{padding:9px}.switchlbl{padding-bottom:6px}
  .key{height:44px}
  .ldig{font-size:60px}
  .fields{gap:9px;padding:12px}.field input{min-height:46px}
}
.ticker{height:18px;margin-top:6px;overflow:hidden;font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;text-overflow:ellipsis;text-shadow:0 0 8px var(--glow-txt)}
.ticker .car{display:inline-block;width:7px;height:11px;background:var(--led);vertical-align:-1px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lrow{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--lrow)}
.ldig{font:900 76px/1 var(--dots);text-align:center;margin:8px 0 4px;text-shadow:0 0 18px var(--glow-txt);font-variant-numeric:tabular-nums;position:relative}
.ldig.dim{color:var(--led-off);text-shadow:none}

/* ---------- Ablesewerte ---------- */
.read{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;margin:12px 14px 0;flex:none}
.read > *{border:1.5px solid var(--edge);border-radius:16px;padding:9px 10px 8px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:0;text-align:left}
.read b{display:block;font:900 26px/1.05 var(--dots);color:var(--ink);letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.read b.word{font:600 13px/2.05 var(--mono);letter-spacing:.06em}
.read small{display:block;font-size:9px;letter-spacing:.08em;margin-top:2px;white-space:nowrap}
.read .main{background:var(--main-bg);border-color:var(--main-bg);color:var(--main-label)}
.read .main b{color:var(--main-fg)}
.read button.edit{position:relative}
.read button.edit::after{content:"";position:absolute;right:9px;top:9px;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg)}

/* ---------- Woche als Stempelabdrücke ---------- */
.weekhead{display:flex;justify-content:space-between;margin:16px 18px 8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);flex:none}
.week{margin:0 14px;display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px;text-align:center;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);flex:none}
.imp{width:min(100%,76px);aspect-ratio:1;margin:0 auto 6px;border-radius:50%;display:grid;place-content:center;border:2px dashed var(--edge);font:900 18px/1 var(--dots);letter-spacing:0;color:var(--muted)}
.imp small{display:block;font:600 8px var(--mono);letter-spacing:.12em;margin-top:3px}
.imp.done{border:2.5px solid var(--ink);color:var(--ink);transform:rotate(-8deg);box-shadow:inset 0 0 0 2.5px var(--body),inset 0 0 0 4px var(--ink)}
.imp.today{border:2.5px solid var(--accent);color:var(--accent);transform:rotate(6deg);box-shadow:inset 0 0 0 2.5px var(--body),inset 0 0 0 4px var(--accent)}
.day.cur{color:var(--ink);font-weight:600}

/* ---------- Schiebeschalter ---------- */
.switchwrap{margin:0 14px;background:var(--panel);border-radius:28px;padding:12px;flex:none;box-shadow:inset 0 1px 0 var(--hi),inset 0 -2px 0 var(--edge)}
.switchlbl{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:0 6px 8px;color:var(--muted)}
.switchlbl .act{color:var(--ink);font-weight:600}
.track{position:relative;height:66px;border-radius:19px;background:var(--well);box-shadow:inset 0 3px 8px rgba(0,0,0,.22);touch-action:none;cursor:grab}
.track .lane{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:10px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.thumb{position:absolute;top:5px;left:5px;width:calc(50% - 5px);height:56px;border-radius:15px;background:linear-gradient(var(--knob1),var(--knob2));box-shadow:0 2px 0 var(--edge),0 7px 14px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;gap:5px;transition:transform .5s var(--spring)}
.thumb i{width:2px;height:22px;background:var(--edge);border-radius:1px}
.thumb .led{position:absolute;right:12px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--dot)}
.on .thumb .led{background:var(--accent);box-shadow:0 0 8px var(--accent)}

/* ---------- Tasten ---------- */
.keys{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--body)}
@media (min-width:600px){.keys{padding-bottom:22px}}
.key{height:50px;border-radius:15px;background:var(--panel);box-shadow:inset 0 1px 0 var(--hi),0 3px 0 var(--edge);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .08s,box-shadow .08s}
.key:active{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--hi),0 1px 0 var(--edge)}
.key .dot{width:6px;height:6px;border-radius:50%;background:var(--dot)}
.key[aria-current="page"] .dot{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.key[aria-current="page"]{font-weight:600}

/* ---------- Rechner ---------- */
.kinds{display:grid;grid-template-columns:repeat(4,1fr);background:var(--well);border-radius:13px;padding:3px;box-shadow:inset 0 1px 3px rgba(0,0,0,.18)}
.kinds button{padding:9px 2px;border-radius:10px;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kinds button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 0 var(--edge)}
.fields{margin:12px 14px 0;background:var(--panel);border-radius:24px;padding:14px;display:grid;gap:12px;flex:none;box-shadow:inset 0 1px 0 var(--hi),inset 0 -2px 0 var(--edge)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-left:4px}
.field input{width:100%;min-height:52px;padding:10px 12px;border:0;border-radius:14px;background:var(--well);box-shadow:inset 0 2px 6px rgba(0,0,0,.18);font:600 17px var(--mono);color:var(--ink);-webkit-appearance:none;appearance:none}
.field input::-webkit-date-and-time-value{text-align:left}
.bigkey{margin:12px 14px 0;height:58px;border-radius:18px;background:var(--ink);color:var(--panel);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;box-shadow:0 4px 0 #000;transition:transform .08s,box-shadow .08s;flex:none}
.bigkey:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.bigkey:disabled{background:var(--well);color:var(--faint);box-shadow:0 4px 0 var(--edge)}
.msg{margin:10px 18px 0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;min-height:1.4em;color:var(--muted)}
.msg.ok{color:var(--ok)}

/* ---------- Verlauf ---------- */
.wk{margin:12px 14px 0;background:var(--panel);border-radius:22px;padding:12px 14px 4px;flex:none;box-shadow:inset 0 1px 0 var(--hi),inset 0 -2px 0 var(--edge)}
.wk h3{margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding-bottom:10px;border-bottom:1.5px solid var(--edge)}
.wk h3 b{font:900 22px/1 var(--dots);letter-spacing:0}
.badge{font-size:8.5px;letter-spacing:.12em;padding:3px 6px;border-radius:6px;border:1.5px solid currentColor;margin-left:6px;vertical-align:2px}
.badge.ok{color:var(--ok)} .badge.low{color:var(--muted)} .badge.over{color:var(--accent)}
.entry{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--edge)}
.entry:last-child{border-bottom:0}
.entry .info{text-align:left;min-width:0;padding:2px 0}
.entry .info:active{opacity:.55}
.entry .d{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.entry .d::after{content:"";display:inline-block;width:5px;height:5px;margin-left:8px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:rotate(-45deg);vertical-align:2px}
.sheet .fieldset{display:grid;gap:10px}
.sheet .preview{margin:12px 4px 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);min-height:1.4em}
.sheet .preview.err{color:var(--danger)}
/* Feierabend-Planer */
.plan .lcd{padding:12px 14px 10px;margin-bottom:14px}
.plan .ldig{font-size:58px;margin:4px 0 2px}
.plan .range{position:relative;height:56px;border-radius:18px;background:var(--well);box-shadow:inset 0 3px 8px rgba(0,0,0,.22);padding:0 4px;display:flex;align-items:center}
.plan input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:48px;background:transparent;margin:0;touch-action:pan-x}
.plan input[type=range]::-webkit-slider-runnable-track{height:48px;background:transparent}
.plan input[type=range]::-moz-range-track{height:48px;background:transparent}
.plan input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:64px;height:46px;margin-top:1px;border-radius:14px;border:0;background:linear-gradient(var(--knob1),var(--knob2));box-shadow:0 2px 0 var(--edge),0 6px 12px rgba(0,0,0,.2)}
.plan input[type=range]::-moz-range-thumb{width:64px;height:46px;border-radius:14px;border:0;background:linear-gradient(var(--knob1),var(--knob2));box-shadow:0 2px 0 var(--edge),0 6px 12px rgba(0,0,0,.2)}
.plan .scale{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.1em;color:var(--muted);margin:6px 6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips button{padding:8px 11px;border-radius:11px;background:var(--body);box-shadow:inset 0 1px 0 var(--hi),0 2px 0 var(--edge);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.chips button:active{transform:translateY(1px);box-shadow:0 1px 0 var(--edge)}
.facts{display:grid;grid-template-columns:1fr auto;gap:7px 12px;margin:14px 4px 0;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.facts dt{color:var(--muted)} .facts dd{margin:0;text-align:right;font-weight:600}
.verdict{margin:12px 4px 0;padding:10px 12px;border-radius:12px;font-size:11px;line-height:1.5;letter-spacing:.06em;text-transform:uppercase;background:var(--body);border-left:4px solid var(--ink)}
.verdict.ok{border-color:var(--ok)} .verdict.warn{border-color:var(--danger)}
.entry .t{font-size:10.5px;color:var(--muted);margin-top:2px}
.entry .n{font:900 20px/1 var(--dots);text-align:right}
.entry .del{width:36px;height:36px;border-radius:11px;background:var(--body);box-shadow:inset 0 1px 0 var(--hi),0 2px 0 var(--edge);font-size:16px;color:var(--muted);line-height:1}
.entry .del:active{transform:translateY(1px);box-shadow:0 1px 0 var(--edge)}
.empty{margin:12px 14px 0;padding:22px 18px;border:2px dashed var(--edge);border-radius:22px;color:var(--muted);text-align:center;font-size:11px;letter-spacing:.06em;line-height:1.6;text-transform:uppercase}
.sync{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:center;margin:18px 14px 4px}

/* ---------- Glitzer (nur Pink) ---------- */
:root[data-palette="pink"] :is(.device,.plate,.switchwrap,.key,.fields,.wk,.sheet,.read > :not(.main)){
  background-image:
    radial-gradient(circle,var(--sp1) 0 .6px,transparent 1.3px),
    radial-gradient(circle,var(--sp2) 0 .5px,transparent 1.2px),
    radial-gradient(circle,var(--sp3) 0 .6px,transparent 1.3px);
  background-size:23px 29px,37px 31px,17px 21px;
  background-position:3px 5px,11px 17px,7px 2px}
.twinkles{display:none}
:root[data-palette="pink"] .twinkles{display:block;position:absolute;inset:0;pointer-events:none;z-index:30}
.twinkles i{position:absolute;width:11px;height:11px;background:#fff;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);opacity:0;animation:twinkle 4.2s ease-in-out infinite;filter:drop-shadow(0 0 3px rgba(255,120,200,.9))}
@keyframes twinkle{0%,70%,100%{opacity:0;transform:scale(.3) rotate(0)}80%{opacity:calc(var(--glitter) * .95);transform:scale(1) rotate(45deg)}90%{opacity:0;transform:scale(.4) rotate(90deg)}}

/* ---------- Einstellungen ---------- */
.gear{width:30px;height:30px;border-radius:10px;background:var(--well);box-shadow:inset 0 1px 3px rgba(0,0,0,.18);display:grid;place-items:center;color:var(--muted);flex:none}
.gear:active{transform:scale(.92)}
.gear svg{width:17px;height:17px}
.brand .tools{display:flex;gap:6px;align-items:center}
.setting{margin:0 4px 16px}
.setting h3{margin:0 0 8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.setting .kinds{grid-template-columns:repeat(3,1fr)}
.setting .kinds.two{grid-template-columns:1fr 1fr}
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatch{border-radius:16px;padding:10px;background:var(--body);box-shadow:inset 0 1px 0 var(--hi),0 3px 0 var(--edge);display:grid;gap:8px;text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border:2px solid transparent}
.swatch[aria-pressed="true"]{border-color:var(--accent)}
.swatch .chip{height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;position:relative;overflow:hidden}
.swatch .chip i{width:14px;height:14px;border-radius:50%}
.swatch.classic .chip{background:#D8D5CF}
.swatch.classic .chip i:nth-child(1){background:#140F0B;box-shadow:inset 0 0 0 3px #FF5B23}
.swatch.classic .chip i:nth-child(2){background:#A4C21A;box-shadow:inset 0 0 0 3px #0B2B0B}
.swatch.pink .chip{background:linear-gradient(135deg,#F7C6DC,#FF9ACB);
  background-image:radial-gradient(circle,#fff 0 .7px,transparent 1.4px),linear-gradient(135deg,#F7C6DC,#FF9ACB);background-size:9px 11px,100% 100%}
.swatch.pink .chip i:nth-child(1){background:#2B0618;box-shadow:inset 0 0 0 3px #FF4FB3}
.swatch.pink .chip i:nth-child(2){background:#FFB8DA;box-shadow:inset 0 0 0 3px #5C0A35}

/* ---------- Export ---------- */
.monthnav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;background:var(--well);border-radius:14px;padding:4px;box-shadow:inset 0 1px 3px rgba(0,0,0,.18)}
.monthnav button{height:40px;border-radius:11px;background:var(--panel);box-shadow:0 1px 0 var(--edge);font-size:16px}
.monthnav button:disabled{opacity:.35}
.monthnav b{text-align:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.exsum{display:flex;justify-content:space-between;margin:10px 4px 0;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.exsum b{color:var(--ink)}

/* ---------- Sheet & Hinweis ---------- */
.scrim{position:absolute;inset:0;background:rgba(20,18,14,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;background:var(--panel);border-radius:30px;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);z-index:41;transform:translateY(calc(100% + 20px));transition:transform .5s var(--spring);box-shadow:inset 0 1px 0 var(--hi),0 -10px 40px rgba(0,0,0,.2)}
.sheet.show{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--edge);margin:0 auto 14px}
.sheet h2{margin:0 4px 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.sheet p{margin:0 4px 14px;font-size:12px;line-height:1.55;color:var(--muted)}
.sheet .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sheet .acts button{height:54px;border-radius:16px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;background:var(--body);box-shadow:inset 0 1px 0 var(--hi),0 3px 0 var(--edge)}
.sheet .acts button.primary{background:var(--ink);color:var(--panel);box-shadow:0 3px 0 #000}
.sheet .acts button.danger{background:var(--danger);color:#fff;box-shadow:0 3px 0 var(--danger-edge)}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,-180%);background:var(--ink);color:var(--panel);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:6px 6px 6px 16px;min-height:40px;border-radius:99px;z-index:50;transition:transform .5s var(--spring);white-space:nowrap;display:flex;align-items:center;gap:12px}
.toast:not(.undo){padding-right:16px}
.toast button{display:none;background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:7px 12px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.toast.undo button{display:block}
.toast.show{transform:translate(-50%,0)}
@media (min-width:600px){.toast{top:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="device" id="dev">
  <div class="twinkles" aria-hidden="true">
    <i style="left:7%;top:5%;animation-delay:0s"></i><i style="right:9%;top:31%;animation-delay:1.3s"></i>
    <i style="left:4%;top:52%;animation-delay:2.6s;width:8px;height:8px"></i><i style="right:6%;top:62%;animation-delay:.7s;width:9px;height:9px"></i>
    <i style="left:46%;bottom:13%;animation-delay:3.4s;width:8px;height:8px"></i><i style="left:30%;top:2%;animation-delay:2s;width:7px;height:7px"></i>
  </div>
  <div class="toast" id="toast" role="status"><span id="toast-t"></span><button type="button" id="toast-undo">Rückgängig</button></div>

  <!-- ================= Stempeluhr ================= -->
  <main class="screen" id="scr-clock">
    <div class="plate">
      <span class="screw l"></span><span class="screw r"></span>
      <div class="brand"><b>Stempelkarte · SK-1</b>
        <div class="tools">
          <div class="fmt" role="group" aria-label="Zeitformat"><button type="button" data-view="hm" aria-pressed="true">H:M</button><button type="button" data-view="dec" aria-pressed="false">Dez</button></div>
          <button type="button" class="gear" id="btn-settings" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        </div>
      </div>
      <div class="lcd">
        <div class="scene"><canvas id="cv" role="img" aria-label="Monster zeigt deinen Fortschritt"></canvas></div>
        <div class="ticker"><span id="tick-t"></span><span class="car"></span></div>
      </div>
    </div>
    <div class="read">
      <div class="main">Netto heute<b id="r-net">0:00</b><small id="r-net-s">&nbsp;</small></div>
      <button type="button" class="edit" id="r-goal-btn" aria-label="Feierabend planen"><span id="r-goal-l">Ziel heute</span><b id="r-goal">–</b><small id="r-goal-s">&nbsp;</small></button>
      <button type="button" class="edit" id="r-start-btn" aria-label="Beginn ändern">Beginn<b id="r-start">–</b><small id="r-start-s">&nbsp;</small></button>
    </div>
    <div class="weekhead"><span id="w-kw">KW</span><span id="w-sum">Woche 0:00</span></div>
    <div class="week" id="week"></div>
    <div class="switchwrap">
      <div class="switchlbl"><span id="l-off" class="act">Aus</span><span>Zum Stempeln schieben</span><span id="l-on">Ein</span></div>
      <div class="track" id="track" role="switch" aria-checked="false" aria-label="Eingestempelt" tabindex="0">
        <div class="lane"><span>Feierabend</span><span>Dienst</span></div>
        <div class="thumb" id="thumb"><i></i><i></i><i></i><span class="led"></span></div>
      </div>
    </div>
  </main>

  <!-- ================= Rechner ================= -->
  <main class="screen" id="scr-calc" hidden>
    <div class="plate">
      <span class="screw l"></span><span class="screw r"></span>
      <div class="brand"><b>Rechner</b><span>45 Min Pause ab 6 Std</span></div>
      <div class="lcd">
        <div class="lrow"><span>Netto</span><span id="c-day">–</span></div>
        <div class="ldig dim" id="c-net">--:--</div>
        <div class="lrow"><span id="c-pres">Anw. --:--</span><span id="c-pause">Pause –</span></div>
      </div>
    </div>
    <div class="fields">
      <div class="kinds" role="group" aria-label="Art des Tages" id="c-kinds">
        <button type="button" data-kind="work" aria-pressed="true">Arbeit</button><button type="button" data-kind="urlaub" aria-pressed="false">Urlaub</button><button type="button" data-kind="krank" aria-pressed="false">Krank</button><button type="button" data-kind="feiertag" aria-pressed="false">Feiertag</button>
      </div>
      <div class="field"><label for="c-date">Datum</label><input type="date" id="c-date"></div>
      <div class="row2" id="c-times">
        <div class="field"><label for="c-start">Beginn</label><input type="time" id="c-start"></div>
        <div class="field"><label for="c-end">Ende</label><input type="time" id="c-end"></div>
      </div>
    </div>
    <button class="bigkey" id="c-save" type="button" disabled>Als Arbeitstag speichern</button>
    <p class="msg" id="c-msg"></p>
  </main>

  <!-- ================= Verlauf ================= -->
  <main class="screen" id="scr-hist" hidden>
    <div class="plate">
      <span class="screw l"></span><span class="screw r"></span>
      <div class="brand"><b>Verlauf</b>
        <div class="tools"><span id="h-count">0 Tage</span>
          <button type="button" class="gear" id="btn-export" aria-label="Stundenzettel exportieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
        </div>
      </div>
      <div class="lcd">
        <div class="lrow"><span id="h-kw">Diese Woche</span><span id="h-state">–</span></div>
        <div class="ldig" id="h-sum">0:00</div>
        <div class="lrow"><span>Ziel 19 – 19,5 Std</span><span id="h-rest">–</span></div>

  <nav class="keys" aria-label="Bereiche">

    <button class="key" type="button" data-tab="hist"><span class="dot"></span>Verlauf</button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h">
    <div class="grab"></div>
    <h2 id="sheet-h"></h2>
    <div id="sheet-b"></div>
    <div class="acts" id="sheet-a"></div>
  </div>
</div>

<script>
(function(){
  // ---------- Regeln ----------
  const PAUSE_AB_MIN = 360;   // über 6 Std Anwesenheit am Stück ...
  const PAUSE_MIN = 45;       // ... werden 45 Min abgezogen
  const WOCHE_MIN = 19 * 60;  // 19 Std
  const WOCHE_MAX = 19.5 * 60;// 19,5 Std
  const TAGE_PRO_WOCHE = 3;   // Arbeitstage pro Woche (welche Tage, ist egal)
  const GUTSCHRIFT = 380;     // Urlaub, Krank, Feiertag: 6,33 Std (= 6 Std 20 Min) netto
  const KINDS = {
    urlaub:   { label: "Urlaub",   hello: "Urlaub! Gönn dir was." },
    krank:    { label: "Krank",    hello: "Gute Besserung!" },
    feiertag: { label: "Feiertag", hello: "Feiertag! Genieß ihn." }
  };

  const LS_KEY = "stempelkarte:v1";
  const LS_VIEW = "stempelkarte:view";

  // ---------- Zustand ----------
  let state = { entries: [], active: null };
  let view = "hm";
  let tab = "clock";
  let docRef = null;

  try { const raw = localStorage.getItem(LS_KEY); if (raw) { const s = JSON.parse(raw); if (s && Array.isArray(s.entries)) state = { entries: s.entries, active: s.active || null }; } } catch(e){}
  try { const v = localStorage.getItem(LS_VIEW); if (v === "hm" || v === "dec") view = v; } catch(e){}

  function save(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
    if (docRef) docRef.set({ entries: state.entries, active: state.active, v: 1 }).catch(()=>{});
  }

  // ---------- Rechnen ----------
  function netOf(presenceMin){ return presenceMin > PAUSE_AB_MIN ? presenceMin - PAUSE_MIN : presenceMin; }
  function pauseOf(presenceMin){ return presenceMin > PAUSE_AB_MIN ? PAUSE_MIN : 0; }
  function minsBetween(a, b){ return (b - a) / 60000; }
  // Abwesenheiten (Urlaub, Krank, Feiertag) haben start = end = Mittag des Tages und eine feste Gutschrift
  function entryNet(e){ return e.type ? GUTSCHRIFT : netOf(minsBetween(e.start, e.end)); }
  const absenceOn = ds => state.entries.find(e => e.type && dayStart(e.start) === ds);
  function presenceFor(need){ return need <= PAUSE_AB_MIN ? need : need + PAUSE_MIN; }

  // Text, z. B. "4 Std 32 Min" oder "4,53 Std"
  function fmt(min){
    const neg = min < 0; min = Math.abs(min);
    let out;
    if (view === "dec") {
      const h = Math.round(min / 60 * 100) / 100;
      out = h.toLocaleString("de-DE", { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + " Std";
    } else {
      const total = Math.floor(min + 1e-9);
      const h = Math.floor(total / 60), m = total % 60;
      out = h && m ? `${h} Std ${m} Min` : h ? `${h} Std` : `${m} Min`;
    }
    return (neg ? "−" : "") + out;
  }
  // Ziffern fürs Display, z. B. "4:32" oder "4,53"
  function dig(min){
    min = Math.max(0, min);
    if (view === "dec") return (Math.floor(min / 60 * 100) / 100).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const t = Math.floor(min + 1e-9); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
  }
  const clock = t => new Date(t).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  const dayLabel = t => new Date(t).toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "numeric" });
  const dayStart = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };

  function weekStart(t){
    const d = new Date(t); d.setHours(0,0,0,0);
    const dow = (d.getDay() + 6) % 7; // Montag = 0
    d.setDate(d.getDate() - dow); return d.getTime();
  }
  function isoWeek(t){
    const d = new Date(t); d.setHours(0,0,0,0);
    d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
    const w1 = new Date(d.getFullYear(), 0, 4);
    return 1 + Math.round(((d - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7);
  }
  function weekDoneMin(ws){
    return state.entries.filter(e => weekStart(e.start) === ws).reduce((s, e) => s + entryNet(e), 0);
  }
  function dayDoneMin(ds){
    return state.entries.filter(e => dayStart(e.start) === ds).reduce((s, e) => s + entryNet(e), 0);
  }

  // Alles, was Stempeluhr und Monster brauchen.
  // Tagesziel = was in der Woche noch fehlt, verteilt auf die verbleibenden Arbeitstage (heute mitgezählt).
  function today(){
    const now = Date.now(), a = state.active;
    const ref = a ? a.start : now;
    const ws = weekStart(ref), td = dayStart(ref);
    const weekEntries = state.entries.filter(e => weekStart(e.start) === ws);
    const prior = weekEntries.reduce((sum, e) => sum + entryNet(e), 0);
    const todayDone = weekEntries.filter(e => dayStart(e.start) === td).reduce((sum, e) => sum + entryNet(e), 0);
    const otherDays = new Set(weekEntries.map(e => dayStart(e.start)).filter(d => d !== td)).size;
    const daysLeft = Math.max(1, TAGE_PRO_WOCHE - otherDays);
    const priorOther = prior - todayDone;
    const dayTarget = Math.max(0, (WOCHE_MIN - priorOther) / daysLeft);
    const dayMax = Math.max(0, (WOCHE_MAX - priorOther) / daysLeft);
    const pres = a ? Math.max(0, minsBetween(a.start, now)) : 0;
    const net = netOf(pres);
    const todayNet = todayDone + net;
    const need = dayTarget - todayDone;             // in dieser Schicht noch nötig
    const goalAt = a ? a.start + presenceFor(Math.max(0, need)) * 60000 : null;
    const maxAt = a ? a.start + presenceFor(Math.max(0, dayMax - todayDone)) * 60000 : null;
    const week = prior + (a && weekStart(a.start) === weekStart(now) ? net : 0);
    let mode = "walk";
    if (!a) mode = "sleep";
    else if (todayNet > dayMax || week > WOCHE_MAX) mode = "over";
    else if (todayNet >= dayTarget) mode = "goal";
    else if (pres > PAUSE_AB_MIN && pres < PAUSE_AB_MIN + PAUSE_MIN) mode = "pause";
    else if (pres >= PAUSE_AB_MIN - 30 && pres <= PAUSE_AB_MIN) mode = "warn";
    // Für den nächsten Arbeitstag, wenn gerade nicht eingestempelt
    const daysLeftNext = Math.max(1, TAGE_PRO_WOCHE - otherDays - (todayDone > 0 ? 1 : 0));
    const nextTarget = Math.max(0, (WOCHE_MIN - prior) / daysLeftNext);
    return { now, a, prior, pres, net, need, goalAt, maxAt, week, mode, k: need > 0 ? net / need : 1,
             todayNet, dayTarget, dayMax, daysLeft, daysLeftNext, nextTarget, lastDay: daysLeft === 1 };
  }

  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };
  const $ = id => document.getElementById(id);

  // ---------- Hinweis & Sheet ----------
  const $toast = $("toast"); let tt;
  let undoFn = null;
  // Hinweis oben; mit undo erscheint 5 Sek. lang ein „Rückgängig“-Knopf
  function say(m, undo){
    $("toast-t").textContent = m; undoFn = undo || null;
    $toast.classList.toggle("undo", !!undo); $toast.classList.add("show");
    clearTimeout(tt); tt = setTimeout(() => { $toast.classList.remove("show"); undoFn = null; }, undo ? 5000 : 2000);
  }
  $("toast-undo").onclick = () => { const f = undoFn; undoFn = null; if (f) { f(); buzz(12); say("Rückgängig gemacht"); } };
  // Zustand merken und wiederherstellen (für Rückgängig)
  const snapshot = () => JSON.stringify(state);
  function restore(j){ state = JSON.parse(j); save(); renderAll(); }
  function sheet(title, html, actions){
    $("sheet-h").textContent = title; $("sheet-b").innerHTML = html;
    const box = $("sheet-a"); box.innerHTML = ""; box.style.gridTemplateColumns = "";
    actions.forEach(a => { const b = document.createElement("button"); b.type = "button"; b.textContent = a.label; if (a.cls) b.className = a.cls;
      b.onclick = () => { if (a.run && a.run() === false) return; closeSheet(); }; box.appendChild(b); });
    $("scrim").classList.add("show"); $("sheet").classList.add("show");
    setTimeout(() => { const f = box.lastChild; f && f.focus({ preventScroll: true }); }, 350); // kein Auto-Fokus auf Eingaben (würde die Tastatur öffnen)
  }
  function closeSheet(){ $("scrim").classList.remove("show"); $("sheet").classList.remove("show"); }
  $("scrim").onclick = closeSheet;
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  // ---------- LED-Matrix ----------
  const COLS = 52; let ROWS = 38, P = 1, OX = 0, OY = 0;
  const cv = $("cv"), ctx = cv.getContext("2d");
  const off = document.createElement("canvas"), octx = off.getContext("2d");
  let buf = new Uint8Array(COLS * ROWS);             // 0 aus, 1 halb, 2 voll
  const C = {};
  function readColors(){
    const css = getComputedStyle(document.documentElement), v = n => css.getPropertyValue(n).trim();
    Object.assign(C, { bg: v("--lcd"), off: v("--led-off"), half: v("--led-half"), full: v("--led"), glow: parseFloat(v("--glow-a")) || 0, square: v("--px-square") === "1", bow: v("--bow") === "1" });
    $("meta-theme").setAttribute("content", v("--body"));
  }
  readColors();
  // Hell/Dunkel folgt dem System; das Display wechselt dann zwischen LED-Orange und Game-Boy-Grün
  const darkMQ = window.matchMedia("(prefers-color-scheme: dark)");
  (darkMQ.addEventListener ? darkMQ.addEventListener.bind(darkMQ, "change") : darkMQ.addListener.bind(darkMQ))(readColors);

  // ---------- Erscheinungsbild ----------
  const LS_THEME = "stempelkarte:theme", LS_PALETTE = "stempelkarte:palette";
  let theme = "auto", palette = "classic";
  try { const t = localStorage.getItem(LS_THEME); if (t === "light" || t === "dark") theme = t; if (localStorage.getItem(LS_PALETTE) === "pink") palette = "pink"; } catch(e){}
  function applyAppearance(){
    const root = document.documentElement;
    if (theme === "auto") delete root.dataset.theme; else root.dataset.theme = theme;
    if (palette === "pink") root.dataset.palette = "pink"; else delete root.dataset.palette;
    try { localStorage.setItem(LS_THEME, theme); localStorage.setItem(LS_PALETTE, palette); } catch(e){}
    readColors();
  }

  // Breite bestimmt die Punktgröße; mehr Höhe bedeutet mehr Himmel
  function fitCanvas(){
    const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    off.width = cv.width; off.height = cv.height;
    P = cv.width / COLS;
    ROWS = Math.floor(cv.height / P);
    if (ROWS < 28) { ROWS = 28; P = cv.height / ROWS; }
    OX = (cv.width - COLS * P) / 2; OY = cv.height - ROWS * P;
    GROUND = ROWS - 4;
    buf = new Uint8Array(COLS * ROWS);
  }
  const put = (x, y, v) => { x |= 0; y |= 0; if (x >= 0 && x < COLS && y >= 0 && y < ROWS && v > buf[y * COLS + x]) buf[y * COLS + x] = v; };
  function sprite(rows, x, y, flip){
    rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) { const ch = flip ? r[r.length - 1 - i] : r[i]; if (ch === "#") put(x + i, y + j, 2); else if (ch === "+") put(x + i, y + j, 1); } });
  }
  function present(){
    const p = P, r = p * .36;
    // Game-Boy-Modus: eckige LCD-Pixel, die fast die ganze Zelle füllen → scharfe, geschlossene Formen
    if (C.square) {
      const q = p * .9, h = q / 2;
      ctx.fillStyle = C.bg; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = C.off;
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (!buf[y * COLS + x]) ctx.fillRect(OX + (x + .5) * p - h, OY + (y + .5) * p - h, q, q);
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        const v = buf[y * COLS + x]; if (!v) continue;
        ctx.fillStyle = v === 2 ? C.full : C.half;
        ctx.fillRect(OX + (x + .5) * p - h, OY + (y + .5) * p - h, q, q);
      }
      return;
    }
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, cv.width, cv.height);
    octx.clearRect(0, 0, off.width, off.height);
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const v = buf[y * COLS + x], cx = OX + (x + .5) * p, cy = OY + (y + .5) * p;
      ctx.fillStyle = v === 2 ? C.full : v === 1 ? C.half : C.off;
      ctx.beginPath(); ctx.arc(cx, cy, v ? r * 1.08 : r, 0, 6.2832); ctx.fill();
      if (v === 2 && C.glow) { octx.fillStyle = C.full; octx.beginPath(); octx.arc(cx, cy, r * 1.3, 0, 6.2832); octx.fill(); }
    }
    if (C.glow) { ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = C.glow; ctx.filter = `blur(${p * .45}px)`; ctx.drawImage(off, 0, 0); ctx.restore(); }
  }

  // ---------- Sprites ----------
  // Das Monster: Hörnchen, große Augen, Zahn, Bauch (15 breit, 16 hoch)
  const BODY = [
    "..#.........#..",
    "..##.......##..",
    "...#########...",
    "..###########..",
    ".#############.",
    null, null, null,                 // Augen
    ".#############.",
    null, null,                       // Mund
    ".#############.",
    ".##+++++++++##.",
    "..###########.."
  ];
  const EYES = {
    open:  [".##+..###+..##.", ".##...###...##.", ".###.#####.###."],
    look:  [".##..+###..+##.", ".##...###...##.", ".###.#####.###."],
    blink: [".#############.", ".##...###...##.", ".#############."],
    happy: [".###.#####.###.", ".##.#.###.#.##.", ".#############."],
    shut:  [".#############.", ".#############.", ".##...###...##."],
    wide:  [".#...#####...#.", ".#.+.#####.+.#.", ".##.#######.##."]
  };
  const MOUTH = {
    smile: [".####.#...####.", ".#####...#####."],
    grin:  [".###.#.....###.", ".####.....####."],
    oh:    [".######.######.", ".#####...#####."],
    sip:   [".#############.", ".######.######."],
    sleep: [".#############.", ".#####...#####."]
  };
  const LEGS = [
    ["...##.....##...", "..###.....###.."],
    ["...##.....##...", "..###......###."],
    ["...##.....##...", ".###.....###..."]
  ];
  const SIT = [".###.......###."];
  const ARMS = ["#.............#", "#.............#"];
  const BOW = ["##.##", "#.#.#", "##.##"];
  function monster(x, y, eyes, mouth, legs, armsUp, flip){
    BODY.forEach((r, j) => { if (r) sprite([r], x, y + j, flip); });
    if (C.bow) sprite(C.square ? BOW.map(r => r.replace(/#/g, "+")) : BOW, x + 5, y - 1);   // Pink: Schleife zwischen den Hörnchen
    sprite(EYES[eyes], x, y + 5, flip);
    sprite(MOUTH[mouth], x, y + 9, flip);
    sprite(legs, x, y + 14, flip);
    sprite(ARMS, x, y + (armsUp ? 2 : 10));
  }
  const HOUSE = ["....#....", "...###...", "..#####..", ".#######.", "#########", ".#.....#.", ".#.###.#.", ".#.#+#.#.", ".#.#+#.#."];
  const CUP = ["+++++.", "#####.", "######", "#####.", "#####."];
  const FLAG = ["#####", "####.", "#####", "#....", "#....", "#....", "#....", "#....", "#....", "#....", "#...."];
  const MAXF = ["+++", "++.", "+++", "+..", "+..", "+..", "+..", "+.."];
  const SUN = [".+#+.", "+###+", "#####", "+###+", ".+#+."];
  const MOON = [".##.", "##..", "##..", ".##."];
  const CLOUD = ["..++++..", ".++++++.", "++++++++"];
  const Z = ["###", "..#", ".#.", "#..", "###"];
  const DROP = ["#", "#", "+"];
  const BANG = ["#", "#", "#", ".", "#"];

  // ---------- Szene ----------
  let GROUND = 34; const WALK0 = 10, WALK1 = 22, CUPX = 37, FLAGX = 44;
  let charX = null, jumpT = 0, blinkUntil = 0, confetti = [], tapMsg = null, tapUntil = 0;

  function draw(t){
    buf.fill(0);
    const s = today();
    const d = new Date(), hour = d.getHours() + d.getMinutes() / 60;
    const sky = Math.max(8, GROUND - 24);          // nutzbare Himmelshöhe über dem Monster
    if (hour >= 6 && hour <= 20) { const u = (hour - 6) / 14; sprite(SUN, 2 + u * 44, 2 + (1 - Math.sin(u * Math.PI)) * sky); }
    if (C.bow) for (let i = 0; i < 5; i++) {        // Pink: ein paar funkelnde Glitzerpunkte am Himmel
      const k = (Math.floor(t / 700) + i * 3) % 7; if (k > 1) continue;
      const gx = (i * 19 + 7) % COLS, gy = 3 + (i * 11) % Math.max(4, sky);
      put(gx, gy, 2); if (k === 0) { put(gx - 1, gy, 1); put(gx + 1, gy, 1); put(gx, gy - 1, 1); put(gx, gy + 1, 1); }
    }
    else {
      sprite(MOON, 44, 2);
      for (let i = 0; i < 14; i++) { const sx = (i * 37 + 11) % COLS, sy = (i * 23 + 5) % (sky + 6); if (sx < 42 || sy > 6) put(sx, sy, (Math.floor(t / 600) + i) % 5 ? 1 : 2); }
    }
    sprite(CLOUD, ((t / 900) % 66) - 9, 4 + Math.round(sky * .2));
    sprite(CLOUD, ((t / 1400 + 33) % 66) - 9, 4 + Math.round(sky * .75));
    for (let x = 0; x < COLS; x++) put(x, GROUND + 1, x % 2 ? 0 : 1);
    sprite(HOUSE, 0, GROUND - 8);
    const cupX = CUPX;                              // Tasse steht fest kurz vor der Fahne
    sprite(CUP, cupX, GROUND - 4);
    if (s.mode === "pause" || s.mode === "warn") { const st = Math.floor(t / 300) % 3; put(cupX + 1 + (st === 1 ? 1 : 0), GROUND - 6 - st % 2, 1); put(cupX + 3 - (st === 2 ? 1 : 0), GROUND - 7 + st % 2, 1); }
    sprite(FLAG, FLAGX, GROUND - 10); sprite(MAXF, FLAGX + 5, GROUND - 7);

    let tx;
    if (s.mode === "sleep") tx = WALK0;
    else if (s.mode === "pause") tx = cupX - 15;
    else tx = WALK0 + Math.min(1, s.k) * (WALK1 - WALK0);
    if (charX === null) charX = tx;
    charX += (tx - charX) * .08;
    const x = Math.round(charX);
    if (s.mode !== "sleep") for (let i = WALK0 + 2; i < x + 7; i++) put(i, GROUND + 1, 2);

    const moving = Math.abs(tx - charX) > .4;
    let eyes = "open", mouth = "smile", armsUp = false, y = GROUND - 14, legs = LEGS[0], seated = false, bob = 0;
    if (s.mode === "walk") { legs = LEGS[Math.floor(t / 260) % 2 ? 1 : 2]; bob = Math.floor(t / 260) % 2; eyes = "look"; }
    if (s.mode === "warn") { eyes = Math.floor(t / 700) % 2 ? "open" : "wide"; mouth = "oh"; legs = LEGS[Math.floor(t / 200) % 2 ? 1 : 2]; }
    if (s.mode === "pause") { const sipping = Math.floor(t / 1600) % 2; eyes = sipping ? "blink" : "happy"; mouth = sipping ? "sip" : "smile"; seated = true; }
    if (s.mode === "goal") { eyes = "happy"; mouth = "grin"; armsUp = true; bob = -Math.round(Math.abs(Math.sin(t / 220)) * 3); if (Math.random() < .35) confetti.push({ x: Math.random() * COLS, y: 0, v: .15 + Math.random() * .25 }); }
    if (s.mode === "over") { eyes = "wide"; mouth = "oh"; armsUp = Math.floor(t / 240) % 2 === 1; legs = LEGS[Math.floor(t / 120) % 2 ? 1 : 2]; }
    if (s.mode === "sleep") { eyes = "shut"; mouth = "sleep"; seated = true; const zt = (t / 90) % 40; sprite(Z, x + 16, GROUND - 16 - zt / 6); if (zt > 20) sprite(Z.map(r => r.replace(/#/g, "+")), x + 19, GROUND - 22 - (zt - 20) / 6); }
    if (t < blinkUntil && s.mode !== "sleep") eyes = "blink"; else if (Math.random() < .006) blinkUntil = t + 140;
    if (moving && s.mode !== "sleep") legs = LEGS[Math.floor(t / 140) % 2 ? 1 : 2];
    if (t < jumpT) { const k = (jumpT - t) / 520; bob -= Math.round(Math.sin(k * Math.PI) * 5); eyes = "happy"; mouth = "grin"; armsUp = true; }
    y += bob + (seated ? 1 : 0);
    monster(x, y, eyes, mouth, seated ? SIT : legs, armsUp, s.mode !== "sleep" && tx < charX - .4);
    if (s.mode === "over") { sprite(BANG, x + 17, y - 1); if (Math.floor(t / 300) % 2) sprite(DROP, x - 2, y + 4); }
    if (s.mode === "warn" && Math.floor(t / 500) % 2) sprite(DROP, x + 16, y + 3);
    if (s.mode !== "goal") confetti = [];
    confetti = confetti.filter(c => (c.y += c.v) < GROUND);
    confetti.forEach(c => put(c.x, c.y, Math.random() < .5 ? 2 : 1));
    present();
  }

  // ---------- Laufschrift ----------
  let shown = "";
  function message(){
    if (tapMsg && Date.now() < tapUntil) return tapMsg;
    const s = today();
    switch (s.mode) {
      case "sleep": { const ab = absenceOn(dayStart(s.now)); if (ab) return KINDS[ab.type].hello; }
        return s.todayNet ? `Feierabend! Heute ${dig(s.todayNet)} Std.` : s.week >= WOCHE_MIN ? "Woche geschafft!" : `Bereit! Pro Tag ${dig(s.nextTarget)} Std.`;
      case "warn":  return `In ${Math.ceil(PAUSE_AB_MIN - s.pres)} Min greift die Pause!`;
      case "pause": return `Kaffeepause! 6 Std netto ab ${clock(s.a.start + (PAUSE_AB_MIN + PAUSE_MIN) * 60000)}`;
      case "goal":  return s.lastDay && s.week >= WOCHE_MIN ? "Woche geschafft! 19 Std." : s.maxAt > s.now ? `Tagesziel! Max. bis ${clock(s.maxAt)}` : "Tagesziel geschafft!";
      case "over":  return s.week > WOCHE_MAX ? "Über 19,5 Std. Ab nach Hause!" : "Genug für heute. Ab nach Hause!";
      default:      return `Noch ${dig(s.need - s.net)} Std bis Tagesziel.`;
    }
  }
  setInterval(() => {
    if (tab !== "clock") return;
    const target = message();
    if (!target.startsWith(shown)) shown = "";
    if (shown.length < target.length) { shown = target.slice(0, shown.length + 1); $("tick-t").textContent = shown; }
  }, 38);

  // ---------- Stempeluhr ----------
  function renderClock(){
    const s = today();
    $("dev").classList.toggle("on", !!s.a);
    $("r-net").textContent = dig(s.todayNet);
    $("r-net-s").textContent = s.a ? `Anw. ${dig(s.pres)}${pauseOf(s.pres) ? " −45" : ""}` : " ";
    const goal = $("r-goal"), gl = $("r-goal-l"), gs = $("r-goal-s");
    if (!s.a && s.week >= WOCHE_MIN) { gl.textContent = "Woche"; goal.textContent = "geschafft"; gs.textContent = "\u00a0"; }
    else if (!s.a) { gl.textContent = "Pro Tag"; goal.textContent = dig(s.nextTarget); gs.textContent = `noch ${s.daysLeftNext} ${s.daysLeftNext === 1 ? "Tag" : "Tage"}`; }
    else if (s.mode === "goal" || s.mode === "over") { gl.textContent = "Ziel heute"; goal.textContent = "erreicht"; gs.textContent = s.maxAt > s.now ? "max. " + clock(s.maxAt) : "Feierabend!"; }
    else { gl.textContent = "Ziel heute"; goal.textContent = clock(s.goalAt); gs.textContent = dig(s.dayTarget) + " netto"; }
    goal.classList.toggle("word", /[a-z]/.test(goal.textContent));
    $("r-start").textContent = s.a ? clock(s.a.start) : "–";
    $("r-start-s").textContent = s.a ? "Ändern" : " ";
    $("r-start-btn").disabled = !s.a;

    const ws = weekStart(s.now);
    $("w-kw").textContent = `Diese Woche · KW ${isoWeek(s.now)}`;
    $("w-sum").textContent = dig(s.week) + (view === "dec" ? " Std" : "");
    // Ein Stempelfeld pro Arbeitstag, egal an welchem Wochentag
    const names = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"], td = dayStart(s.now);
    const worked = [...new Set(state.entries.filter(e => weekStart(e.start) === ws).map(e => dayStart(e.start)))];
    if (s.a && weekStart(s.a.start) === ws && !worked.includes(dayStart(s.a.start))) worked.push(dayStart(s.a.start));
    worked.sort((x, y) => x - y);
    const slots = Math.max(TAGE_PRO_WOCHE, worked.length);
    let html = "";
    for (let i = 0; i < slots; i++) {
      const ds = worked[i];
      if (ds === undefined) { html += `<div class="day"><div class="imp"></div>Tag ${i + 1}</div>`; continue; }
      const live = s.a && dayStart(s.a.start) === ds;
      const v = dayDoneMin(ds) + (live ? s.net : 0);
      const ab = absenceOn(ds);
      html += `<div class="day${ds === td ? " cur" : ""}"><div class="imp ${ds === td ? "today" : "done"}">${dig(v)}<small>${ab ? KINDS[ab.type].label : "Std"}</small></div>${names[new Date(ds).getDay()]}</div>`;
    }
    $("week").style.setProperty("--n", slots);
    $("week").innerHTML = html;

    $("thumb").style.transform = s.a ? "translateX(100%)" : "translateX(0)";
    $("track").setAttribute("aria-checked", String(!!s.a));
    $("l-on").classList.toggle("act", !!s.a); $("l-off").classList.toggle("act", !s.a);
  }

  function setActive(want){
    if (want === !!state.active) return renderClock();
    const before = snapshot(), undo = () => restore(before);
    if (want) {
      state.active = { start: Date.now() }; charX = 0;
      buzz([10, 40, 10]); say("Eingestempelt " + clock(state.active.start), undo);
    } else {
      const start = state.active.start, end = Date.now();
      if (end - start >= 60000) { state.entries.push({ id: "e" + end.toString(36), start, end }); say("Aus · " + dig(netOf(minsBetween(start, end))) + " Std", undo); }
      else say("Unter 1 Min, nicht gespeichert", undo);
      state.active = null; buzz(18);
    }
    save(); renderAll();
  }

  // ---------- Vergessen auszustempeln? ----------
  // Über 12 Std eingestempelt oder seit gestern (ab 4 Uhr früh) → nachfragen, einmal pro Schicht
  let askedFor = null;
  function checkForgot(){
    const a = state.active; if (!a || askedFor === a.start) return;
    const now = Date.now(), hrs = (now - a.start) / 36e5;
    const newDay = dayStart(now) > dayStart(a.start) && new Date(now).getHours() >= 4;
    if (hrs < 12 && !newDay) return;
    askedFor = a.start;
    const s = today();
    const guess = Math.min(s.goalAt || a.start + 6 * 36e5, a.start + 12 * 36e5);
    sheet("Vergessen auszustempeln?",
      `<p>Du bist seit ${dayLabel(a.start)}, ${clock(a.start)} eingestempelt (${Math.floor(hrs)} Std). Wann hast du wirklich aufgehört?</p>
       <div class="field"><label for="fg-end">Ende am ${dayLabel(a.start)}</label><input type="time" id="fg-end" value="${clock(guess)}"></div>
       <p class="preview" id="fg-prev"></p>`,
      [
        { label: "Läuft noch" },
        { label: "Ausstempeln", cls: "primary", run: () => {
          const end = endFrom(a.start, $("fg-end").value);
          if (!end || end > Date.now()) { $("fg-prev").textContent = "Bitte eine Uhrzeit vor jetzt wählen"; $("fg-prev").className = "preview err"; return false; }
          const before = snapshot();
          state.entries.push({ id: "e" + end.toString(36), start: a.start, end }); state.active = null;
          save(); renderAll(); buzz(18); say("Aus · " + dig(netOf(minsBetween(a.start, end))) + " Std", () => restore(before));
        } }
      ]);
    const upd = () => { const end = endFrom(a.start, $("fg-end").value); const p = $("fg-prev");
      p.className = "preview"; p.textContent = end ? `Netto ${dig(netOf(minsBetween(a.start, end)))} Std${pauseOf(minsBetween(a.start, end)) ? " · 45 Min Pause" : ""}` : ""; };
    $("fg-end").addEventListener("input", upd); upd();
  }
  // Uhrzeit "HH:MM" als Ende nach dem Beginn (bei kleinerer Uhrzeit: Folgetag)
  function endFrom(start, hhmm){
    if (!hhmm) return null;
    const [h, m] = hhmm.split(":").map(Number);
    const d = new Date(start); d.setHours(h, m, 0, 0);
    if (d.getTime() <= start) d.setDate(d.getDate() + 1);
    return d.getTime();
  }

  // Schiebeschalter
  (function(){
    const track = $("track"), thumb = $("thumb"); let x0 = null, moved = false;
    const w = () => track.clientWidth / 2 - 5;
    track.addEventListener("pointerdown", e => { x0 = e.clientX; moved = false; track.setPointerCapture(e.pointerId); thumb.style.transition = "none"; buzz(5); });
    track.addEventListener("pointermove", e => {
      if (x0 === null) return; const dx = e.clientX - x0; if (Math.abs(dx) > 4) moved = true;
      thumb.style.transform = `translateX(${Math.max(0, Math.min(w(), (state.active ? w() : 0) + dx))}px)`;
    });
    track.addEventListener("pointerup", e => {
      if (x0 === null) return; const dx = e.clientX - x0; x0 = null; thumb.style.transition = "";
      const x = Math.max(0, Math.min(w(), (state.active ? w() : 0) + dx));
      setActive(moved ? x > w() / 2 : !state.active);
    });
    track.addEventListener("pointercancel", () => { x0 = null; thumb.style.transition = ""; renderClock(); });
    track.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setActive(!state.active); } });
  })();

  // Beginn ändern
  // ---------- Feierabend-Planer ----------
  // Eingestempelt: Ende von jetzt bis 12 Std nach Beginn. Sonst: nächsten Tag mit Beginn und Ende planen.
  $("r-goal-btn").onclick = openPlanner;
  function openPlanner(){
    const s = today(), active = !!s.a, STEP = 5;
    const lastStart = [...state.entries].sort((x, y) => y.start - x.start)[0];
    const startDefault = lastStart ? clock(lastStart.start) : "08:00";
    const daysAfterBase = active ? s.daysLeft - 1 : s.daysLeftNext - 1;
    const baseWeek = s.prior;                       // Woche ohne die geplante Schicht
    const target = active ? s.dayTarget - (s.todayNet - s.net) : s.nextTarget;
    let start = active ? s.a.start : null;
    sheet(active ? "Feierabend planen" : "Nächsten Tag planen", `
      <div class="plan">
        <div class="lcd">
          <div class="lrow"><span id="pl-lbl">Wenn ich gehe um</span><span id="pl-pres">Anw. –</span></div>
          <div class="ldig" id="pl-time">--:--</div>
          <div class="lrow"><span id="pl-net">Netto –</span><span id="pl-pause">–</span></div>
        </div>
        ${active ? "" : `<div class="field" style="margin-bottom:12px"><label for="pl-start">Beginn</label><input type="time" id="pl-start" value="${startDefault}"></div>`}
        <div class="range"><input type="range" id="pl-range" step="${STEP}" aria-label="Ende"></div>
        <div class="scale"><span id="pl-min">–</span><span id="pl-max">–</span></div>
        <div class="chips" id="pl-chips"></div>
        <dl class="facts">
          <dt>Woche danach</dt><dd id="pl-week">–</dd>
          <dt>Restliche Tage</dt><dd id="pl-rest">–</dd>
        </dl>
        <p class="verdict" id="pl-verdict"></p>
      </div>`, [{ label: "Fertig", cls: "primary" }]);
    $("sheet-a").style.gridTemplateColumns = "1fr";
    const rg = $("pl-range");
    let lastStep = null;
    function bounds(){
      if (active) {
        const nowMin = Math.ceil(minsBetween(start, Date.now()) / STEP) * STEP;
        return [Math.max(STEP, nowMin), Math.max(nowMin + 60, 12 * 60)];
      }
      return [60, 12 * 60];
    }
    function startOf(){
      if (active) return start;
      const v = $("pl-start").value || "08:00", [h, m] = v.split(":").map(Number);
      const d = new Date(); d.setHours(h, m, 0, 0); return d.getTime();
    }
    function setRange(minutes){
      const [lo, hi] = bounds(); rg.min = lo; rg.max = hi;
      rg.value = Math.min(hi, Math.max(lo, Math.round(minutes / STEP) * STEP));
    }
    function chips(){
      const st = startOf(), list = [];
      if (target > 0) list.push(["Tagesziel", presenceFor(target)]);
      if (active) list.push(["Jetzt", minsBetween(st, Date.now())]);
      if (!active || minsBetween(st, Date.now()) < PAUSE_AB_MIN) list.push(["6 Std, keine Pause", PAUSE_AB_MIN]);
      if (!active || minsBetween(st, Date.now()) < presenceFor(Math.max(0, WOCHE_MAX - baseWeek))) list.push(["Max. Woche", presenceFor(Math.max(0, WOCHE_MAX - baseWeek))]);
      $("pl-chips").innerHTML = list.map(([l, v]) => `<button type="button" data-v="${Math.round(v)}">${l}</button>`).join("");
      $("pl-chips").querySelectorAll("button").forEach(b => b.onclick = () => { setRange(+b.dataset.v); upd(); buzz(8); });
    }
    function upd(){
      const st = startOf(), pres = +rg.value, net = netOf(pres), end = st + pres * 60000;
      const [lo, hi] = bounds();
      $("pl-min").textContent = clock(st + lo * 60000); $("pl-max").textContent = clock(st + hi * 60000);
      $("pl-time").textContent = clock(end);
      $("pl-pres").textContent = "Anw. " + dig(pres);
      $("pl-net").textContent = "Netto " + dig(net) + " Std";
      $("pl-pause").textContent = pauseOf(pres) ? "Pause −45" : "Keine Pause";
      const weekAfter = baseWeek + net;
      const daysAfter = Math.max(0, daysAfterBase);
      $("pl-week").textContent = `${dig(weekAfter)} von 19 Std`;
      const missing = WOCHE_MIN - weekAfter;
      $("pl-rest").textContent = missing <= 0 ? "Nichts mehr nötig" : daysAfter ? `${dig(missing / daysAfter)} Std × ${daysAfter}` : `Es fehlen ${dig(missing)}`;
      const v = $("pl-verdict");
      if (pres > PAUSE_AB_MIN && pres < PAUSE_AB_MIN + PAUSE_MIN) {
        v.className = "verdict warn"; v.textContent = `Pausenfalle: Wegen der 45 Min Pause hast du weniger als beim Gehen um ${clock(st + PAUSE_AB_MIN * 60000)}. Gleich viel erst ab ${clock(st + (PAUSE_AB_MIN + PAUSE_MIN) * 60000)}.`;
      } else if (weekAfter > WOCHE_MAX) {
        v.className = "verdict warn"; v.textContent = `Zu viel: ${dig(weekAfter - WOCHE_MAX)} Std über 19,5. Spätestens um ${clock(st + presenceFor(Math.max(0, WOCHE_MAX - baseWeek)) * 60000)} gehen.`;
      } else if (weekAfter >= WOCHE_MIN) {
        v.className = "verdict ok"; v.textContent = daysAfter ? "Woche schon im Ziel. Die restlichen Tage kannst du frei lassen." : "Woche im Ziel. Perfekt!";
      } else if (!daysAfter) {
        v.className = "verdict warn"; v.textContent = `Letzter Tag: Es fehlen dann noch ${dig(missing)} Std bis 19. Gehe frühestens um ${clock(st + presenceFor(WOCHE_MIN - baseWeek) * 60000)}.`;
      } else if (net >= target - .5) {
        v.className = "verdict ok"; v.textContent = `Tagesziel geschafft. Danach noch ${dig(missing / daysAfter)} Std an ${daysAfter === 1 ? "einem Tag" : daysAfter + " Tagen"}.`;
      } else {
        v.className = "verdict"; v.textContent = `Unter dem Tagesziel. Die restlichen ${daysAfter === 1 ? "Tag muss" : daysAfter + " Tage müssen"} dann je ${dig(missing / daysAfter)} Std schaffen.`;
      }
      const step = Math.round(pres / 15); if (lastStep !== null && step !== lastStep) buzz(4); lastStep = step;
    }
    setRange(target > 0 ? presenceFor(target) : (active ? minsBetween(start, Date.now()) : 6 * 60));
    chips(); upd();
    rg.addEventListener("input", upd);
    if (!active) $("pl-start").addEventListener("input", () => { chips(); upd(); });
  }

  $("r-start-btn").onclick = () => {
    if (!state.active) return;
    sheet("Beginn ändern", `<p>Wann hast du heute angefangen?</p><div class="field"><label for="edit-time">Beginn</label><input type="time" id="edit-time" value="${clock(state.active.start)}"></div>`, [
      { label: "Abbrechen" },

  // Monster antippen

  // ---------- Rechner ----------
  const $cd = $("c-date"), $cs = $("c-start"), $ce = $("c-end");
  const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  $cd.value = todayISO();

  function calcRange(){
    if (!$cs.value || !$ce.value || !$cd.value) return null;
    const [y, mo, da] = $cd.value.split("-").map(Number);
    const [sh, sm] = $cs.value.split(":").map(Number), [eh, em] = $ce.value.split(":").map(Number);
    const s = new Date(y, mo - 1, da, sh, sm).getTime();
    let e = new Date(y, mo - 1, da, eh, em).getTime();
    if (e <= s) e += 864e5; // über Mitternacht
    return { s, e, overnight: new Date(e).getDate() !== new Date(s).getDate() };
  }
  let calcKind = "work";
  document.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => {
    calcKind = b.dataset.kind; buzz(5);
    document.querySelectorAll("[data-kind]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    $("c-msg").textContent = ""; $("c-msg").className = "msg"; renderCalc();
  });
  const noonOf = iso => new Date(iso + "T12:00").getTime();
  function renderCalc(){
    $("c-day").textContent = $cd.value ? dayLabel(noonOf($cd.value)) : "–";
    $("c-times").hidden = calcKind !== "work";
    if (calcKind !== "work") {
      const k = KINDS[calcKind];
      $("c-net").textContent = dig(GUTSCHRIFT); $("c-net").classList.remove("dim");
      $("c-pres").textContent = "Gutschrift netto"; $("c-pause").textContent = k.label;
      $("c-save").textContent = `${k.label} eintragen`; $("c-save").disabled = !$cd.value; return;
    }
    $("c-save").textContent = "Als Arbeitstag speichern";
    const r = calcRange();
    if (!r) {
      $("c-net").textContent = view === "dec" ? "-,--" : "--:--"; $("c-net").classList.add("dim");
      $("c-pres").textContent = "Beginn und Ende eingeben"; $("c-pause").textContent = "";
      $("c-save").disabled = true; return;
    }
    const pres = minsBetween(r.s, r.e);
    $("c-net").textContent = dig(netOf(pres)); $("c-net").classList.remove("dim");
    $("c-pres").textContent = "Anw. " + dig(pres) + (r.overnight ? " · bis Folgetag" : "");
    $("c-pause").textContent = pauseOf(pres) ? "Pause −45" : "Keine Pause";
    $("c-save").disabled = false;
  }
  [$cd, $cs, $ce].forEach(el => el.addEventListener("input", () => { $("c-msg").textContent = ""; $("c-msg").className = "msg"; renderCalc(); }));
  function storeCalc(r){
    const before = snapshot();
    state.entries.push({ id: "m" + Date.now().toString(36), start: r.s, end: r.e });
    save(); renderAll(); buzz([10, 40, 10]);
    $("c-msg").textContent = `Gespeichert: ${dayLabel(r.s)}, ${fmt(netOf(minsBetween(r.s, r.e)))}`; $("c-msg").className = "msg ok";
    say("Gespeichert", () => { restore(before); $("c-msg").textContent = ""; });
  }
  function storeAbsence(iso, kind){
    const before = snapshot(), t = noonOf(iso);
    state.entries.push({ id: "a" + Date.now().toString(36), type: kind, start: t, end: t });
    save(); renderAll(); buzz([10, 40, 10]);
    $("c-msg").textContent = `Eingetragen: ${dayLabel(t)}, ${KINDS[kind].label}, ${fmt(GUTSCHRIFT)}`; $("c-msg").className = "msg ok";
    say(KINDS[kind].label + " eingetragen", () => { restore(before); $("c-msg").textContent = ""; });
  }
  $("c-save").onclick = () => {
    if (calcKind !== "work") {
      if (!$cd.value) return;
      const kind = calcKind, iso = $cd.value, ds = dayStart(noonOf(iso));
      const same = state.entries.filter(e => dayStart(e.start) === ds);
      if (!same.length) return storeAbsence(iso, kind);
      return sheet("Tag schon belegt", `<p>Für ${dayLabel(noonOf(iso))} gibt es schon ${same.length === 1 ? "einen Eintrag" : same.length + " Einträge"}. Trotzdem ${KINDS[kind].label} eintragen?</p>`, [
        { label: "Abbrechen" }, { label: "Eintragen", cls: "primary", run: () => storeAbsence(iso, kind) }
      ]);
    }
    const r = calcRange(); if (!r) return;
    const clash = state.entries.some(e => r.s < e.end && r.e > e.start);
    if (!clash) return storeCalc(r);
    sheet("Überschneidung", "<p>Dieser Zeitraum überschneidet sich mit einem gespeicherten Arbeitstag. Trotzdem speichern?</p>", [
      { label: "Abbrechen" }, { label: "Speichern", cls: "primary", run: () => storeCalc(r) }
    ]);
  };

  // ---------- Verlauf ----------
  function renderHist(){
    const s = today();
    $("h-kw").textContent = `KW ${isoWeek(s.now)}`;
    $("h-sum").textContent = dig(s.week);
    $("h-state").textContent = s.week > WOCHE_MAX ? "Über Maximum" : s.week >= WOCHE_MIN ? "Im Ziel" : "Unter Ziel";
    $("h-rest").textContent = s.week < WOCHE_MIN ? "Noch " + dig(WOCHE_MIN - s.week) : s.week <= WOCHE_MAX ? "Max. noch " + dig(WOCHE_MAX - s.week) : "+" + dig(s.week - WOCHE_MAX);
    $("h-count").textContent = state.entries.length === 1 ? "1 Tag" : state.entries.length + " Tage";
    const box = $("hist");
    if (!state.entries.length) { box.innerHTML = `<div class="empty">Noch keine Arbeitstage.<br>Schieb den Schalter auf der Uhr oder trag einen Tag im Rechner nach.</div>`; return; }
    const sorted = [...state.entries].sort((a, b) => b.start - a.start);
    const groups = new Map();
    sorted.forEach(e => { const k = weekStart(e.start); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); });
    let html = "";
    groups.forEach((list, ws) => {
      const sum = list.reduce((a, e) => a + entryNet(e), 0);
      const st = sum > WOCHE_MAX ? ["over", "Über 19,5"] : sum >= WOCHE_MIN ? ["ok", "Im Ziel"] : ["low", "Unter 19"];
      const nDays = new Set(list.map(e => dayStart(e.start))).size;
      html += `<section class="wk"><h3><span>KW ${isoWeek(ws)} · ${nDays} ${nDays === 1 ? "Tag" : "Tage"}<span class="badge ${st[0]}">${st[1]}</span></span><b>${dig(sum)}</b></h3>`;
      list.forEach(e => {
        const pres = minsBetween(e.start, e.end);
        const desc = e.type ? `${KINDS[e.type].label} · Gutschrift` : `${clock(e.start)} – ${clock(e.end)}${pauseOf(pres) ? " · 45 Min Pause" : ""}`;
        html += `<div class="entry"><button class="info" type="button" data-edit="${e.id}" aria-label="Eintrag vom ${dayLabel(e.start)} bearbeiten"><div class="d">${dayLabel(e.start)}</div><div class="t">${desc}</div></button>
          <div class="n">${dig(entryNet(e))}</div>
          <button class="del" type="button" data-del="${e.id}" aria-label="Eintrag vom ${dayLabel(e.start)} löschen">×</button></div>`;
      });
      html += `</section>`;
    });
    box.innerHTML = html;
    box.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
      const e = state.entries.find(x => x.id === b.dataset.del); if (!e) return;
      sheet("Eintrag löschen", `<p>${dayLabel(e.start)}, ${e.type ? KINDS[e.type].label : clock(e.start) + " – " + clock(e.end)} (${fmt(entryNet(e))}) wird gelöscht.</p>`, [
        { label: "Abbrechen" },
        { label: "Löschen", cls: "danger", run: () => { const before = snapshot(); state.entries = state.entries.filter(x => x.id !== e.id); save(); renderAll(); buzz(18); say("Gelöscht", () => restore(before)); } }
      ]);
    });
    box.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => editEntry(b.dataset.edit));
  }

  const isoDate = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  function editEntry(id){
    const e = state.entries.find(x => x.id === id); if (!e) return;
    if (e.type) return editAbsence(e);
    const read = () => {
      const dv = $("ed-date").value, sv = $("ed-start").value, ev = $("ed-end").value;
      if (!dv || !sv || !ev) return null;
      const [y, mo, da] = dv.split("-").map(Number), [sh, sm] = sv.split(":").map(Number);
      const start = new Date(y, mo - 1, da, sh, sm).getTime();
      return { start, end: endFrom(start, ev) };
    };
    sheet("Eintrag bearbeiten",
      `<div class="fieldset">
         <div class="field"><label for="ed-date">Datum</label><input type="date" id="ed-date" value="${isoDate(e.start)}"></div>
         <div class="row2">
           <div class="field"><label for="ed-start">Beginn</label><input type="time" id="ed-start" value="${clock(e.start)}"></div>
           <div class="field"><label for="ed-end">Ende</label><input type="time" id="ed-end" value="${clock(e.end)}"></div>
         </div>
       </div>
       <p class="preview" id="ed-prev"></p>`,
      [
        { label: "Abbrechen" },
        { label: "Speichern", cls: "primary", run: () => {
          const r = read();
          if (!r) { $("ed-prev").textContent = "Bitte Datum, Beginn und Ende angeben"; $("ed-prev").className = "preview err"; return false; }
          const before = snapshot();
          e.start = r.start; e.end = r.end; save(); renderAll(); buzz(12);
          say("Gespeichert · " + dig(entryNet(e)) + " Std", () => restore(before));
        } }
      ]);
    const upd = () => {
      const r = read(), p = $("ed-prev"); p.className = "preview";
      if (!r) { p.textContent = ""; return; }
      const pres = minsBetween(r.start, r.end);
      const clash = state.entries.some(x => x.id !== e.id && r.start < x.end && r.end > x.start);
      p.textContent = `Netto ${dig(netOf(pres))} Std${pauseOf(pres) ? " · 45 Min Pause" : ""}${new Date(r.end).getDate() !== new Date(r.start).getDate() ? " · bis Folgetag" : ""}${clash ? " · überschneidet sich" : ""}`;
      if (clash) p.className = "preview err";
    };
    ["ed-date", "ed-start", "ed-end"].forEach(i => $(i).addEventListener("input", upd)); upd();

  function editAbsence(e){

    sheet("Eintrag bearbeiten",

         <div class="kinds" style="grid-template-columns:repeat(3,1fr)" id="ea-kinds">${Object.keys(KINDS).map(k => `<button type="button" data-k="${k}" aria-pressed="${k === kind}">${KINDS[k].label}</button>`).join("")}</div>
         <div class="field"><label for="ea-date">Datum</label><input type="date" id="ea-date" value="${isoDate(e.start)}"></div>
       </div>
       <p class="preview">Gutschrift ${dig(GUTSCHRIFT)} Std netto</p>`,
